<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="取景教練">
<meta name="theme-color" content="#000000">
<title>取景教練</title>
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --muted: rgba(255,255,255,.65);
    --glass: rgba(20,20,20,.62);
    --chip: rgba(255,255,255,.14);
    --accent: #ffd60a;
    --warn: #ff9f0a;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.4 -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; overflow: hidden; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  #app { position: fixed; inset: 0; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  #stage { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; min-height: 0; }
  #frame { position: relative; max-width: 100%; max-height: 100%; }
  #video, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
  #video { object-fit: fill; }

  #top { position: absolute; top: 10px; left: 16px; right: 16px; display: flex; gap: 8px; align-items: flex-start; z-index: 2; }
  #scene { background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-radius: 12px; padding: 8px 12px; flex: 1; min-width: 0; }
  #scene b { font-size: 16px; }
  #scene small { display: block; color: var(--muted); font-size: 12px; }
  #cue { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 3;
    background: var(--warn); color: #000; font-weight: 800; font-size: 22px; padding: 10px 22px;
    border-radius: 99px; white-space: nowrap; box-shadow: 0 4px 16px rgba(0,0,0,.4); }
  #cue.ok { background: #30d158; }

  #bottom { padding: 8px 16px 10px; display: flex; flex-direction: column; gap: 10px; }
  #chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  #chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; width: 138px; text-align: left; background: var(--chip); border-radius: 12px; padding: 8px 10px; }
  .chip b { display: block; font-size: 14px; }
  .chip span { font-size: 11px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .chip.on { background: var(--accent); color: #000; }
  .chip.on span { color: rgba(0,0,0,.7); }
  #controls { display: flex; align-items: center; justify-content: space-between; }
  #thumb { width: 54px; height: 54px; border-radius: 8px; background: var(--chip) center/cover; }
  #shutter { width: 74px; height: 74px; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 3px #000, 0 0 0 3px #fff; }
  #shutter:active { transform: scale(.94); }

  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 10; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; padding: 24px 16px; text-align: center; }
  .sheet h1 { font-size: 28px; margin: 0; }
  .sheet p { color: var(--muted); margin: 0; max-width: 32em; }
  .btn { background: var(--accent); color: #000; font-weight: 700; padding: 14px 28px; border-radius: 99px; font-size: 17px; }
  .btn.ghost { background: var(--chip); color: var(--fg); }
  .sheet input { width: 100%; max-width: 360px; padding: 12px; border-radius: 10px; border: 1px solid var(--chip);
    background: #111; color: var(--fg); font-size: 15px; }
  #preview img { max-height: 60vh; border-radius: 8px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="frame">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="overlay"></canvas>
    </div>
    <div id="top">
      <div id="scene"><b>場景：分析中…</b><small>把鏡頭對準想拍的東西</small></div>
    </div>
    <div id="cue" hidden></div>
  </div>
  <div id="bottom">
    <div id="chips"></div>
    <div id="controls">
      <div id="thumb"></div>
      <button id="shutter" aria-label="拍照"></button>
      <div style="width:54px"></div>
    </div>
  </div>
</div>

<div class="sheet" id="startSheet">
  <h1>取景教練</h1>
  <p>自動判斷畫面，給你幾種專業的取景方式。<br>選一個框，按快門，照片會依照建議裁切。</p>
  <button class="btn" id="startBtn">開啟相機</button>
  <p id="startMsg"></p>
</div>

<div class="sheet" id="preview" hidden>
  <img id="previewImg" alt="拍好的照片">
  <p>長按照片 →「加入照片」即可存到相簿</p>
  <div style="display:flex;gap:10px">
    <button class="btn" id="shareBtn">儲存／分享</button>
    <button class="btn ghost" id="previewClose">繼續拍</button>
  </div>
</div>

<script type="module">
import { FilesetResolver, ObjectDetector, FaceDetector }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = id => document.getElementById(id);
const video = $("video"), overlay = $("overlay"), ctx = overlay.getContext("2d");

/* ---------- 場景 ---------- */
const SCENES = {
  portrait: ["人像", "眼睛放在上三分線，頭頂別留太多空間"],
  food: ["美食", "試試 45° 斜拍，或手機平舉正上方俯拍"],
  animal: ["動物", "蹲到和牠視線一樣高"],
  plant: ["花草", "靠近一點、放低角度，讓背景單純"],
  object: ["物品", "主體放在三分點上，背景越乾淨越好"],
  general: ["風景／街景", "地平線放在上或下三分之一，別切在正中間"],
};
const FOOD = ["banana","apple","sandwich","orange","broccoli","carrot","hot dog","pizza","donut","cake","bowl","cup","wine glass","dining table"];
const ANIMAL = ["bird","cat","dog","horse","sheep","cow","elephant","bear","zebra","giraffe"];
const PLANT = ["potted plant","vase"];

/* ---------- 狀態 ---------- */
let objDet, faceDet;
let suggestions = [];     // {id,title,tip,rect:{x,y,w,h}} 比例座標 0~1
let selected = 0;         // null = 原始畫面
let tiltDeg = null;
let lastPhoto = null;
let lastRun = 0;
let lastSubject = null;
let lastFace = null;
let allCands = [], mainCand = null, pin = null, cue = null;

/* ---------- 啟動 ---------- */
$("startBtn").onclick = async () => {
  $("startMsg").textContent = "載入中…";
  try {
    // iOS 需要使用者點擊後才能讀取陀螺儀
    if (window.DeviceMotionEvent?.requestPermission) {
      try { await DeviceMotionEvent.requestPermission(); } catch {}
    }
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1440 } }, audio: false });
    video.srcObject = stream;
    await video.play();
    layout();
    $("startSheet").hidden = true;
    loadModels();
    window.addEventListener("devicemotion", onMotion);
    requestAnimationFrame(loop);
  } catch (e) {
    $("startMsg").textContent = "無法開啟相機：" + e.message + "。請在 Safari 設定允許相機。";
  }
};

async function loadModels() {
  const fs = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  objDet = await ObjectDetector.createFromOptions(fs, {
    baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite", delegate: "GPU" },
    scoreThreshold: 0.35, runningMode: "VIDEO" });
  faceDet = await FaceDetector.createFromOptions(fs, {
    baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite", delegate: "GPU" },
    runningMode: "VIDEO" });
}

/* 讓畫面框和相機畫面同比例 */
function layout() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw) return;
  const st = $("stage").getBoundingClientRect();
  const s = Math.min(st.width / vw, st.height / vh);
  const f = $("frame");
  f.style.width = vw * s + "px"; f.style.height = vh * s + "px";
  overlay.width = vw * s * devicePixelRatio; overlay.height = vh * s * devicePixelRatio;
}
window.addEventListener("resize", layout);
video.addEventListener("loadedmetadata", layout);

/* ---------- 水平 ---------- */
// 用重力方向計算手機左右傾斜（直拿時最準）
function onMotion(e) {
  const g = e.accelerationIncludingGravity;
  if (!g || g.x == null) return;
  // 手機接近平放時不判斷（例如俯拍美食）
  if (Math.abs(g.z) > Math.hypot(g.x, g.y)) { tiltDeg = null; return; }
  const deg = Math.atan2(g.x, Math.abs(g.y)) * 180 / Math.PI;
  tiltDeg = Math.abs(deg) > 3 && Math.abs(deg) < 35 ? deg : null;
}

/* ---------- 分析迴圈 ---------- */
let lastDims = "";
function loop(t) {
  const dims = `${video.videoWidth}x${video.videoHeight}x${innerWidth}x${innerHeight}`;
  if (dims !== lastDims) { lastDims = dims; layout(); }
  if (objDet && faceDet && t - lastRun > 300 && video.readyState >= 2) {
    lastRun = t;
    analyze(t);
  }
  draw();
  requestAnimationFrame(loop);
}

const NAMES = { person: "人", dog: "狗", cat: "貓", bird: "鳥", cup: "杯子", bowl: "碗", cake: "蛋糕",
  pizza: "披薩", "potted plant": "盆栽", vase: "花瓶", car: "車", bicycle: "腳踏車", book: "書", "cell phone": "手機",
  bottle: "瓶子", "wine glass": "酒杯", sandwich: "三明治", donut: "甜甜圈", chair: "椅子", bench: "長椅" };

function analyze(t) {
  const W = video.videoWidth, H = video.videoHeight;
  const norm = b => ({ x: b.originX / W, y: b.originY / H, w: b.width / W, h: b.height / H });
  const faceDets = faceDet.detectForVideo(video, t).detections;
  const objs = objDet.detectForVideo(video, t + 1).detections
    .map(d => ({ name: d.categories[0].categoryName, score: d.categories[0].score, box: norm(d.boundingBox) }));

  // 候選主角：每張臉（含肩膀）＋每個物件（已有臉的人不重複）
  const cands = faceDets.map(d => {
    const f = norm(d.boundingBox), k = d.keypoints || [];
    return { name: "person", box: clamp01({ x: f.x - f.w * .3, y: f.y - f.h * .2, w: f.w * 1.6, h: f.h * 2.6 }),
             face: { box: f, eyes: k.slice(0, 2), nose: k[2] }, score: 1.5 };
  });
  for (const o of objs) {
    if (o.name === "dining table") continue;
    if (o.name === "person" && cands.some(c => c.face && contains(o.box, center(c.face.box)))) continue;
    cands.push(o);
  }

  // 選主角：使用者點過的優先（持續追蹤），否則選又大又靠近中央的
  let main = null;
  if (pin && cands.length) {
    main = cands.find(c => contains(c.box, pin)) ||
      cands.reduce((a, b) => dist(center(b.box), pin) < dist(center(a.box), pin) ? b : a);
    if (dist(center(main.box), pin) > .35) main = null; else pin = center(main.box);
  }
  if (!main && cands.length) {
    const rank = c => Math.sqrt(area(c.box)) * c.score * (1.3 - dist(center(c.box), { x: .5, y: .5 }));
    main = cands.reduce((a, b) => rank(b) > rank(a) ? b : a);
  }
  mainCand = main;
  allCands = cands;
  lastFace = main?.face || null;

  let scene = "general";
  if (main) scene = main.face || main.name === "person" ? "portrait" : FOOD.includes(main.name) ? "food"
    : ANIMAL.includes(main.name) ? "animal" : PLANT.includes(main.name) ? "plant" : "object";

  const p = analyzePixels();
  let list = main ? suggest(main.box, scene) : [];
  if (!list.length) list = landscapeSuggest(p);
  lastSubject = main?.box || p.subject;

  const [name, tip] = SCENES[scene];
  $("scene").innerHTML = `<b>場景：${name}</b><small>${tip}・點畫面可換主角</small>`;
  updateSuggestions(list);
  cue = computeCue(p);
}

/* 一次只給一個最重要的提示 */
function computeCue(p) {
  if (tiltDeg !== null) return { t: `↻ 轉正 ${Math.abs(Math.round(tiltDeg))}°` };
  const f = lastFace?.box;
  if (f && (f.x < .01 || f.x + f.w > .99 || f.y < .01 || f.y + f.h > .99)) return { t: "↙ 退後一點" };
  const sel = suggestions.find(s => s.id === selected);
  if (sel) {
    const dx = sel.rect.x + sel.rect.w / 2 - .5, dy = sel.rect.y + sel.rect.h / 2 - .5;
    if (Math.max(Math.abs(dx), Math.abs(dy)) > .07)
      return Math.abs(dx) > Math.abs(dy) ? { t: dx > 0 ? "→ 往右移" : "← 往左移" } : { t: dy > 0 ? "↓ 往下移" : "↑ 往上移" };
    if (sel.rect.w < .8) return { t: "⊕ 靠近一點" };
  } else if (lastFace?.eyes.length === 2) {
    const ey = (lastFace.eyes[0].y + lastFace.eyes[1].y) / 2;
    if (ey > 1/3 + .08) return { t: "↓ 手機往下" };
    if (ey < 1/3 - .08) return { t: "↑ 手機往上" };
  }
  if (lastSubject && area(lastSubject) < .03) return { t: "⊕ 靠近一點" };
  if (!mainCand && p.horizon != null && p.horizon > .42 && p.horizon < .58) return { t: "↕ 地平線別放中間" };
  if (p.backlit) return { t: "☀ 逆光，換個方向" };
  if (p.mean < .22) return { t: "☾ 太暗了" };
  return { t: "✓ 可以拍了", ok: true };
}

/* ---------- 構圖建議 ---------- */
const THIRDS = [[1/3,1/3],[2/3,1/3],[1/3,2/3],[2/3,2/3]], CENTER = [[.5,.5]];

function suggest(sub, scene) {
  const out = [];
  const a = best(sub, [.95,.85,.75], THIRDS, .12);
  if (a) out.push({ id: 0, title: "三分法", tip: "主體放在三分點，帶到周圍環境", rect: a });
  const b = best(sub, [.9,.8,.7,.6], CENTER, .2);
  if (b) out.push({ id: 1, title: "置中對稱", tip: "主體放正中間，畫面穩定有力", rect: b });
  const c = best(sub, [.4,.5,.6,.7], [...THIRDS, ...CENTER], .35);
  if (c) out.push({ id: 2, title: scene === "portrait" ? "人像特寫" : "靠近特寫",
    tip: scene === "portrait" ? "眼睛對齊上三分線，背景越簡單越好" : "靠近主體，去掉雜亂的背景", rect: c });
  return out.filter((s, i) => !out.slice(0, i).some(o => iou(o.rect, s.rect) > .85));
}

function best(sub, sizes, targets, idealFill) {
  const cx = sub.x + sub.w / 2, cy = sub.y + sub.h / 2;
  let bestR = null, bestS = -Infinity;
  for (const s of sizes) for (const [tx, ty] of targets) {
    const x = Math.min(Math.max(cx - tx * s, 0), 1 - s), y = Math.min(Math.max(cy - ty * s, 0), 1 - s);
    const r = { x, y, w: s, h: s };
    const inter = intersect(r, sub);
    if (!inter || area(inter) < area(sub) * .92) continue;  // 主體要幾乎完整入鏡
    const err = Math.hypot((cx - x) / s - tx, (cy - y) / s - ty);
    const score = -err * 3 - Math.abs(area(sub) / (s * s) - idealFill);
    if (score > bestS) { bestS = score; bestR = r; }
  }
  return bestR;
}

/* 平滑移動，避免框框亂跳 */
function updateSuggestions(next) {
  suggestions = next.map(n => {
    const old = suggestions.find(o => o.id === n.id);
    if (!old) return n;
    const k = .4, r = {};
    for (const p of ["x","y","w","h"]) r[p] = old.rect[p] + (n.rect[p] - old.rect[p]) * k;
    return { ...n, rect: r };
  });
  if (selected !== null && !suggestions.some(s => s.id === selected)) selected = suggestions[0]?.id ?? null;
  renderChips();
}

/* ---------- 畫面 ---------- */
function draw() {
  const W = overlay.width, H = overlay.height, d = devicePixelRatio;
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.lineWidth = d * .7;
  ctx.beginPath();
  for (const i of [1, 2]) { ctx.moveTo(W * i / 3, 0); ctx.lineTo(W * i / 3, H); ctx.moveTo(0, H * i / 3); ctx.lineTo(W, H * i / 3); }
  ctx.stroke();

  const sel = suggestions.find(s => s.id === selected);
  if (sel) {
    const r = px(sel.rect);
    ctx.fillStyle = "rgba(0,0,0,.45)";
    ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.rect(r.x, r.y + r.h, r.w, -r.h); ctx.fill("evenodd");
  }
  for (const s of suggestions) {
    const r = px(s.rect), on = s.id === selected;
    ctx.setLineDash(on ? [] : [6 * d, 4 * d]);
    ctx.strokeStyle = on ? "#ffd60a" : "rgba(255,255,255,.55)";
    ctx.lineWidth = (on ? 2.5 : 1) * d;
    ctx.strokeRect(r.x, r.y, r.w, r.h);
  }
  ctx.setLineDash([]);

  // 其他可選的物品：淡淡的細框，點了就換成主角
  ctx.strokeStyle = "rgba(255,255,255,.45)"; ctx.lineWidth = 1 * d; ctx.setLineDash([3 * d, 3 * d]);
  for (const c of allCands) if (c !== mainCand) { const r = px(c.face ? c.face.box : c.box); ctx.strokeRect(r.x, r.y, r.w, r.h); }
  ctx.setLineDash([]);
  if (mainCand) {
    const r = px(mainCand.face ? mainCand.face.box : mainCand.box), L = Math.min(r.w, r.h) * .25;
    ctx.strokeStyle = "#ffd60a"; ctx.lineWidth = 3 * d; ctx.beginPath();
    for (const [cx, cy, sx, sy] of [[r.x, r.y, 1, 1], [r.x + r.w, r.y, -1, 1], [r.x, r.y + r.h, 1, -1], [r.x + r.w, r.y + r.h, -1, -1]]) {
      ctx.moveTo(cx, cy + sy * L); ctx.lineTo(cx, cy); ctx.lineTo(cx + sx * L, cy);
    }
    ctx.stroke();
    const label = "主角・" + (mainCand.face ? "人" : NAMES[mainCand.name] || mainCand.name);
    ctx.font = `700 ${13 * d}px -apple-system, sans-serif`;
    const tw = ctx.measureText(label).width + 12 * d, ty = Math.max(r.y - 24 * d, 0);
    ctx.fillStyle = "#ffd60a"; ctx.fillRect(r.x, ty, tw, 20 * d);
    ctx.fillStyle = "#000"; ctx.fillText(label, r.x + 6 * d, ty + 15 * d);
  }
  const cueEl = $("cue");
  if (cue) { cueEl.hidden = false; if (cueEl.textContent !== cue.t) cueEl.textContent = cue.t; cueEl.classList.toggle("ok", !!cue.ok); }
}
const px = r => ({ x: r.x * overlay.width, y: r.y * overlay.height, w: r.w * overlay.width, h: r.h * overlay.height });

function renderChips() {
  const items = [{ id: null, title: "原始畫面", tip: "不裁切" }, ...suggestions];
  const html = items.map(s =>
    `<button class="chip${s.id === selected ? " on" : ""}" data-id="${s.id}"><b>${s.title}</b><span>${s.tip}</span></button>`).join("");
  if ($("chips").innerHTML !== html) $("chips").innerHTML = html;
}
$("chips").onclick = e => {
  const b = e.target.closest(".chip"); if (!b) return;
  selected = b.dataset.id === "null" ? null : +b.dataset.id;
  renderChips();
};

/* ---------- 點畫面換主角 ---------- */
overlay.addEventListener("click", e => {
  const b = overlay.getBoundingClientRect();
  const pt = { x: (e.clientX - b.left) / b.width, y: (e.clientY - b.top) / b.height };
  pin = mainCand && contains(mainCand.box, pt) ? null : pt;   // 點目前主角 = 恢復自動
});

/* ---------- 拍照 ---------- */
$("shutter").onclick = () => {
  const W = video.videoWidth, H = video.videoHeight;
  const r = suggestions.find(s => s.id === selected)?.rect ?? { x: 0, y: 0, w: 1, h: 1 };
  const c = document.createElement("canvas");
  c.width = Math.round(r.w * W); c.height = Math.round(r.h * H);
  c.getContext("2d").drawImage(video, r.x * W, r.y * H, r.w * W, r.h * H, 0, 0, c.width, c.height);
  c.toBlob(blob => {
    lastPhoto = blob;
    const url = URL.createObjectURL(blob);
    $("thumb").style.backgroundImage = `url(${url})`;
    $("previewImg").src = url;
    $("preview").hidden = false;
  }, "image/jpeg", .92);
};
$("thumb").onclick = () => { if (lastPhoto) $("preview").hidden = false; };
$("previewClose").onclick = () => $("preview").hidden = true;
$("shareBtn").onclick = async () => {
  const file = new File([lastPhoto], `取景教練-${Date.now()}.jpg`, { type: "image/jpeg" });
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file] }); } catch {}
  }
};
/* ---------- 像素分析（免費、在手機上算） ---------- */
const probe = document.createElement("canvas");
const pctx = probe.getContext("2d", { willReadFrequently: true });
let pix = null;   // 最近一次的像素分析結果

function analyzePixels() {
  const W = 48, H = Math.round(48 * video.videoHeight / video.videoWidth);
  probe.width = W; probe.height = H;
  pctx.drawImage(video, 0, 0, W, H);
  const d = pctx.getImageData(0, 0, W, H).data;
  const L = new Float32Array(W * H);
  let mean = 0;
  for (let i = 0; i < W * H; i++) { L[i] = (d[i*4] * .3 + d[i*4+1] * .59 + d[i*4+2] * .11) / 255; mean += L[i]; }
  mean /= W * H;

  // 顯著度 = 與整體亮度的差 + 邊緣強度
  const sal = new Float32Array(W * H), edge = new Float32Array(W * H);
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
    const i = y * W + x;
    edge[i] = Math.abs(L[i+1] - L[i-1]) + Math.abs(L[i+W] - L[i-W]);
    sal[i] = Math.abs(L[i] - mean) * .6 + edge[i];
  }
  const sorted = Array.from(sal).sort((a, b) => a - b), cut = sorted[Math.floor(sorted.length * .85)];
  const xs = [], ys = [];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (sal[y*W+x] >= cut) { xs.push(x); ys.push(y); }
  const pct = (a, q) => { a.sort((m, n) => m - n); return a[Math.floor((a.length - 1) * q)]; };
  const subject = xs.length > 10 ? { x: pct(xs, .15) / W, y: pct(ys, .15) / H,
    w: (pct(xs, .85) - pct(xs, .15) + 1) / W, h: (pct(ys, .85) - pct(ys, .15) + 1) / H } : null;

  // 地平線：上方明顯比下方亮的那一列（天空 vs 地面）
  const row = []; for (let y = 0; y < H; y++) { let t = 0; for (let x = 0; x < W; x++) t += L[y*W+x]; row.push(t / W); }
  let horizon = null, bestDiff = .08;
  for (let y = Math.floor(H * .15); y < H * .85; y++) {
    const up = (row[y-3] + row[y-2] + row[y-1]) / 3, down = (row[y] + row[y+1] + row[y+2]) / 3;
    if (up - down > bestDiff) { bestDiff = up - down; horizon = y / H; }
  }

  // 邊緣雜亂度、主體亮度
  let border = 0, nb = 0, inner = 0, ni = 0;
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
    const e = edge[y*W+x], isB = x < W * .15 || x > W * .85 || y < H * .12 || y > H * .88;
    if (isB) { border += e; nb++; } else { inner += e; ni++; }
  }
  const topLum = row.slice(0, Math.floor(H / 3)).reduce((a, b) => a + b, 0) / Math.floor(H / 3);
  const midLum = row.slice(Math.floor(H / 3), Math.floor(H * 2 / 3)).reduce((a, b) => a + b, 0) / (Math.floor(H * 2 / 3) - Math.floor(H / 3));
  pix = { subject, horizon, mean, clutter: border / nb / (inner / ni + 1e-3), backlit: topLum - midLum > .3 };
  return pix;
}

/* 風景構圖：地平線放三分線、主體放三分點 */
function landscapeSuggest(p) {
  const out = [], s = .82;
  const cx = p.subject ? p.subject.x + p.subject.w / 2 : .5;
  const tx = cx < .5 ? 1/3 : 2/3;
  const crop = ty => ({ x: Math.min(Math.max(cx - tx * s, 0), 1 - s), y: Math.min(Math.max(p.horizon - ty * s, 0), 1 - s), w: s, h: s });
  if (p.horizon != null) {
    out.push({ id: 10, title: "天空多一點", tip: "地平線放下三分線，適合天空漂亮時", rect: crop(2/3) });
    out.push({ id: 11, title: "地面多一點", tip: "地平線放上三分線，突顯前景與建築", rect: crop(1/3) });
  }
  if (p.subject && area(p.subject) < .5) {
    const r = best(p.subject, [.9, .8, .7], THIRDS, .15);
    if (r) out.push({ id: 12, title: "焦點三分", tip: "把最吸睛的地方放到三分點", rect: r });
  }
  return out.filter((x, i) => !out.slice(0, i).some(o => iou(o.rect, x.rect) > .85));
}


/* ---------- 工具 ---------- */
function area(r) { return r.w * r.h; }
function center(r) { return { x: r.x + r.w / 2, y: r.y + r.h / 2 }; }
function contains(r, p) { return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function union(rs) {
  const x1 = Math.min(...rs.map(r => r.x)), y1 = Math.min(...rs.map(r => r.y));
  const x2 = Math.max(...rs.map(r => r.x + r.w)), y2 = Math.max(...rs.map(r => r.y + r.h));
  return { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
}
function intersect(a, b) {
  const x = Math.max(a.x, b.x), y = Math.max(a.y, b.y);
  const w = Math.min(a.x + a.w, b.x + b.w) - x, h = Math.min(a.y + a.h, b.y + b.h) - y;
  return w > 0 && h > 0 ? { x, y, w, h } : null;
}
function iou(a, b) { const i = intersect(a, b); return i ? area(i) / (area(a) + area(b) - area(i)) : 0; }
function clamp01(r) { return intersect(r, { x: 0, y: 0, w: 1, h: 1 }); }
