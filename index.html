<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="取景教練">
<meta name="theme-color" content="#000000">
<title>取景教練</title>
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --muted: rgba(255,255,255,.65);
    --glass: rgba(20,20,20,.62);
    --chip: rgba(255,255,255,.14);
    --accent: #ffd60a;
    --warn: #ff9f0a;
    --guide: #64d2ff;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.4 -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; overflow: hidden; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  #app { position: fixed; inset: 0; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  #stage { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; min-height: 0; }
  #frame { position: relative; max-width: 100%; max-height: 100%; overflow: hidden; touch-action: none; }
  #video, #overlay { transform-origin: 50% 50%; }
  /* 三分線畫在外框上，數位放大時不會跟著變形 */
  #frame::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(to right, transparent calc(33.33% - .5px), rgba(255,255,255,.3) calc(33.33% - .5px), rgba(255,255,255,.3) calc(33.33% + .5px), transparent calc(33.33% + .5px),
                      transparent calc(66.66% - .5px), rgba(255,255,255,.3) calc(66.66% - .5px), rgba(255,255,255,.3) calc(66.66% + .5px), transparent calc(66.66% + .5px)),
      linear-gradient(to bottom, transparent calc(33.33% - .5px), rgba(255,255,255,.3) calc(33.33% - .5px), rgba(255,255,255,.3) calc(33.33% + .5px), transparent calc(33.33% + .5px),
                      transparent calc(66.66% - .5px), rgba(255,255,255,.3) calc(66.66% - .5px), rgba(255,255,255,.3) calc(66.66% + .5px), transparent calc(66.66% + .5px)); }
  html, body { touch-action: none; }
  #chips { touch-action: pan-x; }
  button { touch-action: manipulation; }
  #zoom { position: absolute; left: 50%; bottom: 70px; transform: translateX(-50%); z-index: 3;
    background: var(--glass); color: var(--accent); font-weight: 700; font-size: 13px;
    padding: 6px 12px; border-radius: 99px; font-variant-numeric: tabular-nums; }
  #video, #view, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
  #video { object-fit: fill; opacity: 0; }
  #view { transform-origin: 50% 50%; }

  #top { position: absolute; top: 10px; left: 16px; right: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 2; }
  #refImg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; opacity: .4; }
  #refBar { display: flex; align-items: center; gap: 10px; background: var(--glass); border-radius: 12px; padding: 6px 10px;
    font-size: 12px; align-self: flex-start; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  #refBar input { width: 110px; accent-color: var(--guide); touch-action: pan-x; }
  #refBar button { font-size: 16px; padding: 0 4px; }
  .refPick { width: 100%; max-width: 560px; display: flex; gap: 12px; align-items: center; text-align: left;
    background: var(--guide); color: #000; border-radius: 14px; padding: 12px 14px; }
  .refPick b { display: block; font-size: 15px; }
  .refPick span { font-size: 12px; }
  .refPick i { font-style: normal; font-size: 26px; }
  #scene { background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-radius: 12px; padding: 8px 12px; flex: 1; min-width: 0; }
  #scene b { font-size: 16px; }
  #scene small { display: block; color: var(--muted); font-size: 12px; }
  #cue { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 3;
    background: var(--warn); color: #000; font-weight: 800; font-size: 22px; padding: 10px 22px;
    border-radius: 99px; white-space: nowrap; box-shadow: 0 4px 16px rgba(0,0,0,.4); }
  #cue.ok { background: #30d158; }
  /* 水平儀（仿原廠相機）：放在 stage 上，不會跟著數位放大 */
  #level, #flatLevel { position: absolute; left: 50%; top: 50%; z-index: 2; pointer-events: none; }
  #level { width: 200px; height: 0; transform: translate(-50%, -50%); }
  #level i { position: absolute; top: -1px; height: 2px; background: #fff; border-radius: 1px;
    box-shadow: 0 0 3px rgba(0,0,0,.5); transition: background .15s; }
  #level .l { left: 0; width: 44px; }
  #level .r { right: 0; width: 44px; }
  #level .c { left: 56px; width: 88px; transform-origin: 50% 50%; }
  #level.ok i { background: var(--accent); }
  #level.ok .c { left: 0; width: 200px; }
  #flatLevel { width: 0; height: 0; }
  #flatLevel i { position: absolute; width: 28px; height: 28px; margin: -14px 0 0 -14px; }
  #flatLevel i::before, #flatLevel i::after { content: ""; position: absolute; background: #fff; box-shadow: 0 0 3px rgba(0,0,0,.5); }
  #flatLevel i::before { left: 13px; top: 0; width: 2px; height: 28px; }
  #flatLevel i::after { top: 13px; left: 0; height: 2px; width: 28px; }
  #flatLevel .mov::before, #flatLevel .mov::after, #flatLevel.ok i::before, #flatLevel.ok i::after { background: var(--accent); }

  #bottom { padding: 8px 16px 10px; display: flex; flex-direction: column; gap: 10px; }
  #chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  #chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; width: 128px; text-align: left; background: var(--chip); border-radius: 12px; padding: 8px 10px; }
  .chip b { display: block; font-size: 14px; }
  .chip span { font-size: 11px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .chip.on { background: var(--accent); color: #000; }
  .chip.on span { color: rgba(0,0,0,.7); }
  #controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
  #tools { justify-self: end; }
  #thumb { width: 54px; height: 54px; border-radius: 8px; background: var(--chip) center/cover; }
  #shutter { width: 74px; height: 74px; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 3px #000, 0 0 0 3px #fff; }
  #shutter:active { transform: scale(.94); }
  #shutter.busy { opacity: .5; }
  #tplBtn { width: 54px; height: 54px; border-radius: 12px; background: var(--chip); display: flex; flex-direction: column;
    align-items: center; justify-content: center; font-size: 11px; gap: 2px; }
  #tools { display: flex; gap: 6px; }
  #tools button { width: 46px; height: 54px; border-radius: 12px; background: var(--chip); display: flex; flex-direction: column;
    align-items: center; justify-content: center; font-size: 11px; gap: 2px; }
  #tools button.on { background: var(--accent); color: #000; }
  #tools i { font-style: normal; font-size: 20px; line-height: 1; }
  #filterName { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); z-index: 3; pointer-events: none;
    font-size: 30px; font-weight: 800; text-shadow: 0 2px 12px rgba(0,0,0,.6); transition: opacity .4s; }
  .chip .rec { display: inline-block; margin-left: 4px; font-size: 10px; padding: 0 5px; border-radius: 4px;
    background: var(--guide); color: #000; vertical-align: 2px; }
  #tplBtn i { font-style: normal; font-size: 20px; line-height: 1; }

  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 10; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; padding: 24px 16px; text-align: center; }
  .sheet h1 { font-size: 28px; margin: 0; }
  .sheet p { color: var(--muted); margin: 0; max-width: 32em; }
  .btn { background: var(--accent); color: #000; font-weight: 700; padding: 14px 28px; border-radius: 99px; font-size: 17px; }
  .btn.ghost { background: var(--chip); color: var(--fg); }
  #preview img { max-height: 60vh; border-radius: 8px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 範本清單 */
  #gallery { justify-content: flex-start; overflow-y: auto; touch-action: pan-y; background: rgba(0,0,0,.94);
    padding-top: calc(env(safe-area-inset-top) + 20px); }
  #gallery header { width: 100%; max-width: 560px; display: flex; justify-content: space-between; align-items: center; }
  #gallery header h1 { font-size: 22px; }
  #tplGrid { width: 100%; max-width: 560px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;
    padding-bottom: 24px; }
  .tpl { background: var(--chip); border-radius: 14px; padding: 12px; text-align: left; display: flex; gap: 10px; min-width: 0; }
  .tpl.on { outline: 2px solid var(--accent); }
  .tpl div { min-width: 0; }
  .tpl b { display: block; font-size: 14px; margin-bottom: 4px; }
  .tpl ol { margin: 0; padding-left: 16px; font-size: 11px; color: var(--muted); }
  .tpl-svg { flex: none; width: 42px; height: 56px; background: #1c1c1e; border-radius: 6px;
    fill: none; stroke: rgba(255,255,255,.7); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tpl-svg .t { stroke: var(--guide); stroke-dasharray: 3 3; }
  .tpl-svg .g { stroke: rgba(255,255,255,.2); stroke-width: 1; }
  #scene .steps { display: block; color: var(--guide); font-size: 12px; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="frame">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="view"></canvas>
      <img id="refImg" alt="" hidden>
      <canvas id="overlay"></canvas>
    </div>
    <div id="top">
      <div id="scene"><b>範本：分析中…</b><small>把鏡頭對準想拍的東西</small></div>
      <div id="refBar" hidden><span>範例透明度</span><input type="range" id="refOpacity" min="0" max="80" value="40" aria-label="範例透明度"><button id="refOff" aria-label="移除範例">✕</button></div>
    </div>
    <div id="level" hidden><i class="l"></i><i class="c"></i><i class="r"></i></div>
    <div id="flatLevel" hidden><i class="fix"></i><i class="mov"></i></div>
    <div id="cue" hidden></div>
    <div id="filterName" style="opacity:0"></div>
    <button id="zoom" hidden>1.0×</button>
  </div>
  <div id="bottom">
    <div id="chips"></div>
    <div id="controls">
      <div id="thumb"></div>
      <button id="shutter" aria-label="拍照"></button>
      <div id="tools"><button id="bokehBtn" class="on" hidden><i>◎</i>柔焦</button><button id="filterBtn"><i>◐</i>濾鏡</button><button id="tplBtn"><i>▦</i>範本</button></div>
    </div>
  </div>
</div>

<div class="sheet" id="startSheet">
  <h1>取景教練</h1>
  <p>自動判斷你在拍什麼，套用專業範本，<br>一步步告訴你怎麼移動、怎麼拍。</p>
  <button class="btn" id="startBtn">開啟相機</button>
  <p id="startMsg"></p>
</div>

<div class="sheet" id="gallery" hidden>
  <header><h1>拍攝範本</h1><button class="btn ghost" id="galleryClose">關閉</button></header>
  <button class="refPick" id="refPick"><i>⧉</i><div><b>仿拍一張照片</b><span>從相簿選一張喜歡的照片，App 教你拍出一樣的構圖</span></div></button>
  <input type="file" id="refFile" accept="image/*" hidden>
  <p>也可以直接指定範本：</p>
  <div id="tplGrid"></div>
</div>

<div class="sheet" id="preview" hidden>
  <img id="previewImg" alt="拍好的照片">
  <p>按「儲存／分享」→「儲存影像」存到相簿，或長按照片 →「加入照片」</p>
  <div style="display:flex;gap:10px">
    <button class="btn" id="shareBtn">儲存／分享</button>
    <button class="btn ghost" id="previewClose">繼續拍</button>
  </div>
</div>

<script type="module">
import { FilesetResolver, ObjectDetector, FaceDetector, ImageSegmenter }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
import { TEMPLATES, rankTemplates, templateSVG } from "./templates.js";
import { FILTERS, RECOMMEND, FilterRenderer } from "./filters.js";

const $ = id => document.getElementById(id);
const video = $("video"), overlay = $("overlay"), ctx = overlay.getContext("2d");
const GUIDE = "#64d2ff";

const FOOD = ["banana","apple","sandwich","orange","broccoli","carrot","hot dog","pizza","donut","cake","bowl","cup","wine glass"];
const ANIMAL = ["bird","cat","dog","horse","sheep","cow","elephant","bear","zebra","giraffe"];
const NAMES = { person: "人", dog: "狗", cat: "貓", bird: "鳥", cup: "杯子", bowl: "碗", cake: "蛋糕",
  pizza: "披薩", "potted plant": "盆栽", vase: "花瓶", car: "車", bicycle: "腳踏車", book: "書", "cell phone": "手機",
  bottle: "瓶子", "wine glass": "酒杯", sandwich: "三明治", donut: "甜甜圈", chair: "椅子", bench: "長椅" };

/* ---------- 狀態 ---------- */
let visionFiles, objDet, faceDet, segmenter;
let tiltDeg = null, gravity = null;
let lastPhoto = null, lastRun = 0;
let mainCand = null, cue = null;     // mainCand：點選鎖定的主角
let feat = null;                     // 最近一次的畫面特徵
let ranked = [];                     // 符合的範本（分數高到低）
let active = null;                   // 目前套用的範本
let manualId = null;                 // 使用者手動指定的範本
let pendingCue = null;
let dispBox = null;
let filterId = null;                 // null = 跟著範本推薦
let showFilters = false;
let bokehOn = true;
let preview = null, captureGL = null;
try { preview = new FilterRenderer($("view")); } catch { $("video").style.opacity = 1; }  // 不支援 WebGL 就顯示原始畫面
let zoom = 1, hwZoom = null, pinch = null, lastPinchEnd = 0;

/* ---------- 啟動 ---------- */
$("startBtn").onclick = async () => {
  $("startMsg").textContent = "載入中…";
  try {
    // iOS 需要使用者點擊後才能讀取陀螺儀
    if (window.DeviceMotionEvent?.requestPermission) {
      try { await DeviceMotionEvent.requestPermission(); } catch {}
    }
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false });
    video.srcObject = stream;
    const track = stream.getVideoTracks()[0], cap = track.getCapabilities?.() || {};
    if (cap.zoom) hwZoom = { track, min: Math.max(cap.zoom.min, 1), max: Math.min(cap.zoom.max, 10) };
    await video.play();
    layout();
    $("startSheet").hidden = true;
    loadModels();
    window.addEventListener("devicemotion", onMotion);
    requestAnimationFrame(loop);
  } catch (e) {
    $("startMsg").textContent = "無法開啟相機：" + e.message + "。請在 Safari 設定允許相機。";
  }
};

async function loadModels() {
  visionFiles = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  objDet = await ObjectDetector.createFromOptions(visionFiles, {
    baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite", delegate: "CPU" },
    scoreThreshold: 0.35, runningMode: "VIDEO" });
  faceDet = await FaceDetector.createFromOptions(visionFiles, {
    baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite", delegate: "CPU" },
    runningMode: "VIDEO" });
}

/* 讓畫面框和相機畫面同比例 */
function layout() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw) return;
  const st = $("stage").getBoundingClientRect();
  const s = Math.min(st.width / vw, st.height / vh);
  const f = $("frame");
  f.style.width = vw * s + "px"; f.style.height = vh * s + "px";
  overlay.width = vw * s * devicePixelRatio; overlay.height = vh * s * devicePixelRatio;
  $("view").width = overlay.width; $("view").height = overlay.height;
}
window.addEventListener("resize", layout);
video.addEventListener("loadedmetadata", layout);

/* ---------- 水平與手機姿勢 ---------- */
// iPhone 的重力數值正負號和規格相反，其他手機要反過來
const SIGN = /iPhone|iPad|iPod/.test(navigator.userAgent) ? 1 : -1;
let rollDeg = null, flatOffset = null;
function onMotion(e) {
  const g = e.accelerationIncludingGravity;
  if (!g || g.x == null) return;
  gravity = g;
  if (Math.abs(g.z) > 8) {           // 平放：用 x、y 算出前後左右偏多少
    rollDeg = null;
    flatOffset = { x: SIGN * g.x / 9.8, y: -SIGN * g.y / 9.8 };
  } else {
    flatOffset = null;
    rollDeg = Math.abs(g.z) > Math.hypot(g.x, g.y) ? null : SIGN * Math.atan2(g.x, Math.abs(g.y)) * 180 / Math.PI;
  }
  // 手機接近平放時不判斷左右傾斜（例如俯拍美食）
  if (Math.abs(g.z) > Math.hypot(g.x, g.y)) { tiltDeg = null; return; }
  const deg = Math.atan2(g.x, Math.abs(g.y)) * 180 / Math.PI;
  tiltDeg = Math.abs(deg) > 3 && Math.abs(deg) < 35 ? deg : null;
}
const phoneFlat = () => !!gravity && Math.abs(gravity.z) > 8;

/* ---------- 主迴圈：平常只做很輕的運算（水平、透視線、追蹤），不跑辨識模型 ---------- */
let lastDims = "";
function loop(t) {
  const dims = `${video.videoWidth}x${video.videoHeight}x${innerWidth}x${innerHeight}`;
  if (dims !== lastDims) { lastDims = dims; layout(); }
  if (t - lastRun > 250 && video.readyState >= 2 && !identifying) {
    lastRun = t;
    try { lightTick(); } catch (e) { console.warn(e); }   // 出錯也不能讓畫面停住
  }
  try {
    if (preview && video.readyState >= 2) preview.render(video, currentFilter());
    draw();
  } catch (e) { console.warn(e); }
  requestAnimationFrame(loop);
}

function lightTick() {
  const p = analyzePixels();
  if (mainCand) track();
  feat = buildFeat(p);
  if (manualId) active = TEMPLATES.find(t => t.id === manualId);
  if (mainCand || manualId || ref) {
    const next = ref ? refCue(feat) : computeCue(feat, active);
    if (!cue || next.t === cue.t || next.t === pendingCue) cue = next;   // 新提示要連續出現 2 次才換
    pendingCue = next.t;
  } else cue = null;
  renderTop();
}

function buildFeat(p) {
  const m = mainCand;
  const isPerson = !!m && (!!m.face || m.name === "person");
  let face = null;
  if (m?.face) {
    const fc = m.face;
    let turn = 0;
    if (fc.eyes.length === 2 && fc.nose) {
      const mx = (fc.eyes[0].x + fc.eyes[1].x) / 2;
      turn = (fc.nose.x - mx) / (Math.abs(fc.eyes[0].x - fc.eyes[1].x) + 1e-3);
    }
    face = { ...fc, turn };
  }
  const known = !!m && !m.generic;
  return {
    face, person: m?.person || null, subjectBox: m?.box || null, subjectIsPerson: isPerson,
    food: known && FOOD.includes(m.name), animal: known && ANIMAL.includes(m.name),
    object: known && !isPerson && !FOOD.includes(m.name) && !ANIMAL.includes(m.name),
    flat: phoneFlat(), ...p,
  };
}

/* ---------- 點一下：只在這時候辨識一次 ---------- */
const small = document.createElement("canvas");
const sctx2 = small.getContext("2d");
let identifying = false;

async function identifyAt(pt) {
  if (!objDet || !faceDet) { showHint("辨識模型還在載入，請稍等"); return; }
  identifying = true;
  renderTop();
  await new Promise(r => setTimeout(r, 30));              // 先讓畫面顯示「辨識中」
  try {
    const W = small.width = 384, H = small.height = Math.round(384 * video.videoHeight / video.videoWidth);
    sctx2.drawImage(video, 0, 0, W, H);
    const ts = performance.now();
    const norm = b => ({ x: b.originX / W, y: b.originY / H, w: b.width / W, h: b.height / H });
    const faceDets = faceDet.detectForVideo(small, ts).detections;
    const objs = objDet.detectForVideo(small, ts + 1).detections
      .map(d => ({ name: d.categories[0].categoryName, score: d.categories[0].score, box: norm(d.boundingBox) }));

    // 候選：每張臉（含肩膀）＋每個物件（已有臉的人不重複）
    const cands = faceDets.map(d => {
      const f = norm(d.boundingBox), k = d.keypoints || [];
      return { name: "person", box: clamp01({ x: f.x - f.w * .3, y: f.y - f.h * .2, w: f.w * 1.6, h: f.h * 2.6 }),
               face: { box: f, eyes: k.slice(0, 2).map(e => ({ x: e.x, y: e.y })), nose: k[2] && { x: k[2].x, y: k[2].y } } };
    });
    for (const o of objs) {
      if (o.name === "dining table") continue;
      if (o.name === "person" && cands.some(c => c.face && contains(o.box, center(c.face.box)))) continue;
      cands.push(o);
    }
    for (const c of cands) if (c.face) c.person = objs.find(o => o.name === "person" && contains(o.box, center(c.face.box)))?.box || null;

    // 你點到的那個；重疊時選比較小的
    const boxOf = c => c.face ? c.face.box : c.box;
    let hit = cands.filter(c => contains(boxOf(c), pt) || contains(c.box, pt))
      .sort((a, b) => area(boxOf(a)) - area(boxOf(b)))[0];
    if (!hit) {                                             // 沒認出是什麼：就以點的位置當焦點
      const s = .22;
      hit = { name: "spot", generic: true, box: clamp01({ x: pt.x - s / 2, y: pt.y - s / 2, w: s, h: s }) };
    }
    mainCand = hit;
    dispBox = null;
    startTracking(hit.box);

    // 依主角和畫面決定範本（只決定這一次）
    feat = buildFeat(analyzePixels());
    ranked = rankTemplates(feat);
    if (!manualId) {
      active = ranked[0]?.t || null;
      if (active && !filterId) flashFilterName();
    }
    cue = null;
    renderChips();
  } catch (e) {
    console.warn(e);
    showHint("辨識失敗，再點一次");
  } finally {
    identifying = false;
    renderTop();
  }
}

/* ---------- 輕量追蹤：只比對主角那一小塊畫面移到哪 ---------- */
const TW = 128;
const tcan = document.createElement("canvas");
const tctx = tcan.getContext("2d", { willReadFrequently: true });
let trk = null;

function grayFrame() {
  const H = Math.round(TW * video.videoHeight / video.videoWidth);
  tcan.width = TW; tcan.height = H;
  tctx.drawImage(video, 0, 0, TW, H);
  const d = tctx.getImageData(0, 0, TW, H).data, g = new Float32Array(TW * H);
  for (let i = 0; i < g.length; i++) g[i] = (d[i*4] * .3 + d[i*4+1] * .59 + d[i*4+2] * .11) / 255;
  return { g, H };
}
function cut(g, x0, y0, pw, ph) {
  const out = new Float32Array(pw * ph);
  let mean = 0;
  for (let y = 0; y < ph; y++) for (let x = 0; x < pw; x++) { const v = g[(y0 + y) * TW + x0 + x]; out[y * pw + x] = v; mean += v; }
  mean /= out.length;
  for (let i = 0; i < out.length; i++) out[i] -= mean;      // 扣掉平均亮度，光線變化比較不受影響
  return out;
}
function startTracking(box) {
  const { g, H } = grayFrame();
  const pw = Math.max(8, Math.min(40, Math.round(box.w * TW))), ph = Math.max(8, Math.min(40, Math.round(box.h * H)));
  const x = Math.max(0, Math.min(TW - pw, Math.round((box.x + box.w / 2) * TW - pw / 2)));
  const y = Math.max(0, Math.min(H - ph, Math.round((box.y + box.h / 2) * H - ph / 2)));
  trk = { patch: cut(g, x, y, pw, ph), pw, ph, x, y, H, fails: 0 };
}
function track() {
  if (!trk) return;
  const { g, H } = grayFrame();
  if (H !== trk.H) { startTracking(mainCand.box); return; }
  const R = 12;
  let best = Infinity, bx = trk.x, by = trk.y;
  for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++) {
    const x = trk.x + dx, y = trk.y + dy;
    if (x < 0 || y < 0 || x + trk.pw > TW || y + trk.ph > H) continue;
    let mean = 0, n = 0;
    for (let yy = 0; yy < trk.ph; yy += 2) for (let xx = 0; xx < trk.pw; xx += 2) { mean += g[(y + yy) * TW + x + xx]; n++; }
    mean /= n;
    let sad = 0;
    for (let yy = 0; yy < trk.ph; yy += 2) for (let xx = 0; xx < trk.pw; xx += 2)
      sad += Math.abs(g[(y + yy) * TW + x + xx] - mean - trk.patch[yy * trk.pw + xx]);
    sad /= n;
    if (sad < best) { best = sad; bx = x; by = y; }
  }
  if (best > .09) {                                          // 對不上：可能被擋住或移出畫面
    if (++trk.fails > 8) {
      mainCand = null; trk = null; cue = null;
      if (!manualId) active = null;
      showHint("主角跟丟了，點一下重新指定");
      renderChips();
    }
    return;
  }
  trk.fails = 0;
  const sx = (bx - trk.x) / TW, sy = (by - trk.y) / H;
  trk.x = bx; trk.y = by;
  // 慢慢更新樣板，主角角度改變時也跟得上
  const now = cut(g, bx, by, trk.pw, trk.ph);
  for (let i = 0; i < now.length; i++) trk.patch[i] = trk.patch[i] * .9 + now[i] * .1;
  // 主角框、臉、眼睛、身體一起平移
  const mv = r => r && (r.x += sx, r.y += sy);
  mv(mainCand.box); mv(mainCand.person);
  if (mainCand.face) { mv(mainCand.face.box); mainCand.face.eyes.forEach(mv); mv(mainCand.face.nose); }
}

function renderChips() {

// 在畫面上左右滑動切換濾鏡
let swipe = null;
$("stage").addEventListener("touchstart", e => { if (e.touches.length === 1) swipe = { x: e.touches[0].clientX, y: e.touches[0].clientY }; });
$("stage").addEventListener("touchend", e => {

});

/* ---------- 仿拍：疊上範例照片，引導拍出一樣的構圖 ---------- */
let ref = null;   // { subject, faceLike, horizon, vp, analyzing }
$("refPick").onclick = () => $("refFile").click();
$("refFile").onchange = async e => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;

  const img = $("refImg");
  if (img.src) URL.revokeObjectURL(img.src);
  img.src = URL.createObjectURL(file);
  try { await img.decode(); } catch { showHint("這張照片打不開，換一張試試"); return; }
  img.hidden = false;
  $("refBar").hidden = false;
  ref = { analyzing: true };
  renderTop();
  try { ref = await analyzeRef(img); } catch (err) { console.warn(err); ref = { subject: null }; }
  if (!ref.subject && ref.horizon == null && !ref.vp) showHint("範例裡找不到明確的主角，就照著半透明範例對齊吧");
  renderTop();
};
$("refOpacity").oninput = e => $("refImg").style.opacity = e.target.value / 100;
$("refOff").onclick = () => {
  ref = null;
  $("refImg").hidden = true;
  $("refBar").hidden = true;
  cue = null;
  renderTop();
};

async function analyzeRef(img) {
  while (!objDet || !faceDet) await new Promise(r => setTimeout(r, 200));   // 等模型載入
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const c = document.createElement("canvas");
  c.width = 384; c.height = Math.round(384 * ih / iw);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  const ts = performance.now();
  const norm = b => ({ x: b.originX / c.width, y: b.originY / c.height, w: b.width / c.width, h: b.height / c.height });
  const faces = faceDet.detectForVideo(c, ts).detections.map(d => norm(d.boundingBox));
  const objs = objDet.detectForVideo(c, ts + 1).detections
    .filter(d => d.categories[0].categoryName !== "dining table")
    .map(d => ({ box: norm(d.boundingBox), score: d.categories[0].score }));
  const p = analyzePixels(c, c.width, c.height);

  // 範例和相機畫面的比例可能不同（例如 9:16 對 3:4），換算成畫面上看到的位置
  const fa = video.videoWidth / video.videoHeight, ia = iw / ih;
  const fx = ia > fa ? fa / ia : 1, fy = ia > fa ? 1 : ia / fa;
  const mp = q => ({ x: (q.x - (1 - fx) / 2) / fx, y: (q.y - (1 - fy) / 2) / fy });
  const mb = b => ({ ...mp(b), w: b.w / fx, h: b.h / fy });

  let subject = null, faceLike = false;
  if (faces.length) { subject = mb(faces.reduce((a, b) => area(b) > area(a) ? b : a)); faceLike = true; }
  else if (objs.length) subject = mb(objs.reduce((a, b) => area(b.box) * b.score > area(a.box) * a.score ? b : a).box);
  return {
    subject, faceLike,
    horizon: p.horizon != null ? mp({ x: .5, y: p.horizon }).y : null,
    vp: p.vp ? mp(p.vp) : null,
  };
}

function refCue(f) {
  if (ref.analyzing) return { t: "分析範例中…" };
  if (tiltDeg !== null && !f.flat) return { t: "↻ 對齊水平線" };
  if (ref.subject) {
    if (!mainCand) return { t: "👆 點一下你的主角" };
    // 範例是臉就比對臉，是物品就比對物品框
    const cur = ref.faceLike && mainCand.face ? mainCand.face.box : mainCand.box;
    const c = moveCue(center(cur), center(ref.subject), .05);
    if (c) return c;
    const ratio = cur.h / ref.subject.h;
    if (ratio < .8) return { t: "⊕ 靠近一點" };
    if (ratio > 1.25) return { t: "⊖ 退後一點" };
  } else {
    if (ref.vp && f.vp) { const c = moveCue(f.vp, ref.vp, .06); if (c) return c; }
    if (ref.horizon != null && f.horizon != null) { const c = moveCue({ y: f.horizon }, { y: ref.horizon }, .05); if (c) return c; }
  }
  return { t: "✓ 跟範例一樣了", ok: true };
}

function drawRef(W, H, d) {
  if (ref.analyzing) return;
  ctx.save();
  ctx.strokeStyle = GUIDE; ctx.fillStyle = GUIDE; ctx.lineWidth = 2.5 * d; ctx.setLineDash([8 * d, 6 * d]);
  ctx.font = `700 ${12 * d}px -apple-system, sans-serif`;
  if (ref.subject) {
    const r = px(ref.subject);
    ctx.strokeRect(r.x, r.y, r.w, r.h);
    ctx.fillText("範例的主角在這", r.x, Math.min(H - 6 * d, r.y + r.h + 16 * d));
  } else {
    if (ref.horizon != null) {
      ctx.beginPath(); ctx.moveTo(0, ref.horizon * H); ctx.lineTo(W, ref.horizon * H); ctx.stroke();
      ctx.fillText("範例的地平線", 8 * d, ref.horizon * H - 6 * d);
    }
    if (ref.vp) { ctx.beginPath(); ctx.arc(ref.vp.x * W, ref.vp.y * H, 18 * d, 0, Math.PI * 2); ctx.stroke(); }
  }
  ctx.restore();
}

/* ---------- 引導：一次只給一個最重要的提示 ---------- */
// cur 是東西現在的位置，tgt 是範本要它在的位置。東西偏右 → 手機往右轉，它就會往中間移
function moveCue(cur, tgt, tol = .06) {
  const dx = cur.x == null ? 0 : cur.x - tgt.x, dy = cur.y == null ? 0 : cur.y - tgt.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) <= tol) return null;
  return Math.abs(dx) >= Math.abs(dy) ? { t: dx > 0 ? "→ 往右移" : "← 往左移" } : { t: dy > 0 ? "↓ 往下移" : "↑ 往上移" };
}

function computeCue(f, tpl) {
  if (tiltDeg !== null && !f.flat) return { t: "↻ 對齊水平線" };
  if (f.face && (f.face.box.x < .01 || f.face.box.x + f.face.box.w > .99 || f.face.box.y < .01)) return { t: "↙ 退後一點" };
  if (tpl) {
    const g = tpl.target(f);
    if (g.vp && f.vp) { const c = moveCue(f.vp, g.vp, .07); if (c) return c; }
    if (g.eyes && f.face?.eyes.length === 2) {
      const e = { x: (f.face.eyes[0].x + f.face.eyes[1].x) / 2, y: (f.face.eyes[0].y + f.face.eyes[1].y) / 2 };
      const c = moveCue(e, g.eyes, .07); if (c) return c;
    }
    if (g.faceH && f.face) {
      if (f.face.box.h < g.faceH * .7) return { t: "⊕ 靠近一點" };
      if (f.face.box.h > g.faceH * 1.5) return { t: "⊖ 退後一點" };
    }
    if (g.person && f.person) {
      if (f.person.y < .02 || f.person.y + f.person.h > .995) return { t: "⊖ 退後，全身要入鏡" };
      const c = moveCue({ y: f.person.y + f.person.h }, { y: g.person.bottom }, .05); if (c) return c;
      if (f.person.h < .6) return { t: "⊕ 靠近一點" };
    }
    if (g.subject && f.subjectBox) { const c = moveCue(center(f.subjectBox), g.subject, .07); if (c) return c; }
    if (g.subjectH && f.subjectBox) {
      if (f.subjectBox.h < g.subjectH * .7) return { t: "⊕ 靠近一點" };
      if (f.subjectBox.h > g.subjectH * 1.6) return { t: "⊖ 退後一點" };
    }
    if (g.horizon != null && f.horizon != null) { const c = moveCue({ y: f.horizon }, { y: g.horizon }, .06); if (c) return c; }
    if (g.axis != null && f.symAxis != null) { const c = moveCue({ x: f.symAxis }, { x: g.axis }, .04); if (c) return c; }
  }
  if (f.backlit) return { t: "☀ 逆光，換個方向" };
  if (f.mean < .22) return { t: "☾ 太暗了" };
  return { t: "✓ 可以拍了", ok: true };
}

/* ---------- 畫面 ---------- */
function draw() {
  const W = overlay.width, H = overlay.height, d = devicePixelRatio;
  ctx.clearRect(0, 0, W, H);

  // 範本的目標位置（藍色虛線）
  if (ref) drawRef(W, H, d);
  else if (active && feat) drawTarget(active.target(feat), W, H, d);

  if (mainCand) {
    const tb = mainCand.face ? mainCand.face.box : mainCand.box;
    if (!dispBox || dist(center(dispBox), center(tb)) > .3) dispBox = { ...tb };
    else for (const k of ["x", "y", "w", "h"]) dispBox[k] += (tb[k] - dispBox[k]) * .2;   // 主角框平滑移動
    const r = px(dispBox), L = Math.min(r.w, r.h) * .25;
    ctx.strokeStyle = "#ffd60a"; ctx.lineWidth = 3 * d; ctx.beginPath();
    for (const [cx, cy, sx, sy] of [[r.x, r.y, 1, 1], [r.x + r.w, r.y, -1, 1], [r.x, r.y + r.h, 1, -1], [r.x + r.w, r.y + r.h, -1, -1]]) {
      ctx.moveTo(cx, cy + sy * L); ctx.lineTo(cx, cy); ctx.lineTo(cx + sx * L, cy);
    }
    ctx.stroke();
    const label = "🔒 " + (mainCand.generic ? "焦點" : mainCand.face ? "人" : NAMES[mainCand.name] || mainCand.name);
    ctx.font = `700 ${13 * d}px -apple-system, sans-serif`;
    const tw = ctx.measureText(label).width + 12 * d, ty = Math.max(r.y - 24 * d, 0);
    ctx.fillStyle = "#ffd60a"; ctx.fillRect(r.x, ty, tw, 20 * d);
    ctx.fillStyle = "#000"; ctx.fillText(label, r.x + 6 * d, ty + 15 * d);
  }
  // 水平儀
  const lv = $("level"), fl = $("flatLevel");
  lv.hidden = rollDeg == null || Math.abs(rollDeg) > 40;
  if (!lv.hidden) {
    const ok = Math.abs(rollDeg) < 1;
    lv.classList.toggle("ok", ok);
    lv.querySelector(".c").style.transform = ok ? "" : `rotate(${-rollDeg}deg)`;
  }
  fl.hidden = !flatOffset;
  if (flatOffset) {
    const k = 160, dx = Math.max(-80, Math.min(80, flatOffset.x * k)), dy = Math.max(-80, Math.min(80, flatOffset.y * k));
    fl.classList.toggle("ok", Math.hypot(dx, dy) < 4);
    fl.querySelector(".mov").style.transform = `translate(${dx}px, ${dy}px)`;
  }

  const cueEl = $("cue");
  if (cue) { cueEl.hidden = false; if (cueEl.textContent !== cue.t) cueEl.textContent = cue.t; cueEl.classList.toggle("ok", !!cue.ok); }
}

function drawTarget(g, W, H, d) {
  ctx.save();
  ctx.strokeStyle = GUIDE; ctx.fillStyle = GUIDE; ctx.lineWidth = 2 * d; ctx.setLineDash([8 * d, 6 * d]);
  ctx.font = `700 ${12 * d}px -apple-system, sans-serif`;
  const label = (text, x, y) => { ctx.save(); ctx.setLineDash([]); ctx.fillText(text, x, y); ctx.restore(); };
  const hline = (y, text) => { ctx.beginPath(); ctx.moveTo(0, y * H); ctx.lineTo(W, y * H); ctx.stroke(); label(text, 8 * d, y * H - 6 * d); };

  if (g.vp) {
    const x = g.vp.x * W, y = g.vp.y * H;
    ctx.beginPath(); ctx.arc(x, y, 18 * d, 0, Math.PI * 2); ctx.stroke();
    label("消失點放這", x - 30 * d, y - 24 * d);
    if (feat.vp) {   // 目前的消失點（實心點）＋連線
      const cx = feat.vp.x * W, cy = feat.vp.y * H;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x, y); ctx.stroke();
      ctx.setLineDash([]); ctx.beginPath(); ctx.arc(cx, cy, 5 * d, 0, Math.PI * 2); ctx.fill();
    }
  }
  if (g.eyes) {
    const y = g.eyes.y * H;
    hline(g.eyes.y, "眼睛放這條線");
    ctx.setLineDash([]); ctx.beginPath(); ctx.arc(g.eyes.x * W, y, 6 * d, 0, Math.PI * 2); ctx.fill();
  }
  if (g.person) { hline(g.person.top, "頭頂"); hline(g.person.bottom, "腳底"); }
  if (g.horizon != null) {
    hline(g.horizon, "地平線放這");
    if (feat.horizon != null) {   // 目前偵測到的地平線（細實線）
      ctx.save(); ctx.setLineDash([]); ctx.lineWidth = 1 * d; ctx.strokeStyle = "rgba(100,210,255,.5)";
      ctx.beginPath(); ctx.moveTo(0, feat.horizon * H); ctx.lineTo(W, feat.horizon * H); ctx.stroke(); ctx.restore();
    }
  }
  if (g.axis != null) {
    ctx.beginPath(); ctx.moveTo(g.axis * W, 0); ctx.lineTo(g.axis * W, H); ctx.stroke();
    label("中線對齊", g.axis * W + 6 * d, 40 * d);
  }
  if (g.subject) {
    const x = g.subject.x * W, y = g.subject.y * H, r = (g.subjectH ? g.subjectH * H / 2 : 26 * d);
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
    label("主角放這", x - 24 * d, y - r - 6 * d);
  }
  ctx.restore();
}
const px = r => ({ x: r.x * overlay.width, y: r.y * overlay.height, w: r.w * overlay.width, h: r.h * overlay.height });

/* ---------- 雙指縮放（只縮放相機畫面） ---------- */
function setZoom(z) {
  if (hwZoom) {
    z = Math.min(Math.max(z, hwZoom.min), hwZoom.max);
    hwZoom.track.applyConstraints({ advanced: [{ zoom: z }] }).catch(() => {});
  } else {
    z = Math.min(Math.max(z, 1), 5);
    $("view").style.transform = overlay.style.transform = z === 1 ? "" : `scale(${z})`;
  }
  zoom = z;
  $("zoom").hidden = z <= 1.01;
  $("zoom").textContent = z.toFixed(1) + "×";
}
const stage = $("stage");
const span = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
stage.addEventListener("touchstart", e => {
  if (e.touches.length === 2) { pinch = { d: span(e.touches), z: zoom }; e.preventDefault(); }
}, { passive: false });
stage.addEventListener("touchmove", e => {
  if (pinch && e.touches.length === 2) { setZoom(pinch.z * span(e.touches) / pinch.d); e.preventDefault(); }
}, { passive: false });
stage.addEventListener("touchend", e => {
  if (pinch && e.touches.length < 2) { pinch = null; lastPinchEnd = performance.now(); }
});
$("zoom").onclick = () => setZoom(1);
// 擋掉 Safari 的整頁縮放
for (const ev of ["gesturestart", "gesturechange", "gestureend"]) document.addEventListener(ev, e => e.preventDefault());
let lastTouch = 0;
document.addEventListener("touchend", e => {
  if (e.target.closest("#gallery")) return;
  const n = performance.now(); if (n - lastTouch < 300) e.preventDefault(); lastTouch = n;
}, { passive: false });

/* ---------- 點畫面：辨識並鎖定主角 ---------- */
overlay.addEventListener("click", e => {
  if (performance.now() - lastPinchEnd < 400 || identifying) return;   // 剛縮放完的觸控不算點擊
  const b = overlay.getBoundingClientRect();
  const pt = { x: (e.clientX - b.left) / b.width, y: (e.clientY - b.top) / b.height };
  if (mainCand && contains(mainCand.face ? mainCand.face.box : mainCand.box, pt)) {   // 點已鎖定的主角 = 解除
    mainCand = null; trk = null; cue = null;
    if (!manualId) active = null;
    renderChips(); renderTop();
    return;
  }
  identifyAt(pt);
});

/* ---------- 拍照 ---------- */
$("shutter").onclick = async () => {
  if ($("shutter").classList.contains("busy")) return;
  const W = video.videoWidth, H = video.videoHeight;
  // 數位放大時只存看得到的範圍
  const v = hwZoom || zoom <= 1 ? { x: 0, y: 0, w: 1, h: 1 }
    : { x: .5 - .5 / zoom, y: .5 - .5 / zoom, w: 1 / zoom, h: 1 / zoom };
  let c = document.createElement("canvas");
  c.width = Math.round(v.w * W); c.height = Math.round(v.h * H);
  const c2d = c.getContext("2d");
  try {
    if (!captureGL) captureGL = new FilterRenderer(document.createElement("canvas"));
    captureGL.canvas.width = c.width; captureGL.canvas.height = c.height;
    captureGL.render(video, currentFilter(), v);
    c2d.drawImage(captureGL.canvas, 0, 0);
  } catch {
    c2d.drawImage(video, v.x * W, v.y * H, v.w * W, v.h * H, 0, 0, c.width, c.height);
  }

  // 範本需要背景柔焦時：保留主角，模糊背景
  if (active?.bokeh && bokehOn && mainCand) {
    $("shutter").classList.add("busy");
    try {
      const sub = mainCand.box, inView = {
        x: (sub.x - v.x) / v.w, y: (sub.y - v.y) / v.h, w: sub.w / v.w, h: sub.h / v.h };
      c = await applyBokeh(c, inView, !!mainCand.face || mainCand.name === "person");
    } catch {}
    $("shutter").classList.remove("busy");
  }

  c.toBlob(blob => {
    lastPhoto = blob;
    const url = URL.createObjectURL(blob);
    $("thumb").style.backgroundImage = `url(${url})`;
    $("previewImg").src = url;
    $("preview").hidden = false;
  }, "image/jpeg", .92);
};
$("thumb").onclick = () => { if (lastPhoto) $("preview").hidden = false; };
$("previewClose").onclick = () => $("preview").hidden = true;
$("shareBtn").onclick = async () => {
  const file = new File([lastPhoto], `取景教練-${Date.now()}.jpg`, { type: "image/jpeg" });
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file] }); } catch {}
  }
};

/* ---------- 背景柔焦（模擬大光圈） ---------- */
async function applyBokeh(src, subject, isPerson) {
  const W = src.width, H = src.height;

  // 1. 主角遮罩：人用去背模型，物品用主角周圍的柔邊橢圓
  const mask = document.createElement("canvas");
  if (isPerson) {
    if (!segmenter) segmenter = await ImageSegmenter.createFromOptions(visionFiles, {
      baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite", delegate: "CPU" },
      runningMode: "IMAGE", outputConfidenceMasks: true, outputCategoryMask: false });
    const res = segmenter.segment(src);
    const m = res.confidenceMasks[0], data = m.getAsFloat32Array();
    mask.width = m.width; mask.height = m.height;
    const img = mask.getContext("2d").createImageData(m.width, m.height);
    for (let i = 0; i < data.length; i++) img.data[i * 4 + 3] = Math.min(255, data[i] * 290);
    mask.getContext("2d").putImageData(img, 0, 0);
    res.close?.();
  } else {
    mask.width = 200; mask.height = Math.round(200 * H / W);
    const m = mask.getContext("2d"), c = center(subject);
    const rx = subject.w * mask.width * .75, ry = subject.h * mask.height * .75;
    m.translate(c.x * mask.width, c.y * mask.height); m.scale(1, ry / rx);
    const gr = m.createRadialGradient(0, 0, rx * .6, 0, 0, rx);
    gr.addColorStop(0, "#000"); gr.addColorStop(1, "rgba(0,0,0,0)");
    m.fillStyle = gr; m.beginPath(); m.arc(0, 0, rx, 0, Math.PI * 2); m.fill();
  }

  // 2. 模糊背景：每次縮小一半、再每次放大一倍，結果是平滑的模糊（一次縮放太多會變馬賽克）
  const steps = 4;                                        // 縮到 1/16 再放大回來
  let cur = src;
  const chain = [];
  for (let i = 0; i < steps; i++) {
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(cur.width / 2)); c.height = Math.max(1, Math.round(cur.height / 2));
    const x = c.getContext("2d"); x.imageSmoothingQuality = "high";
    x.drawImage(cur, 0, 0, c.width, c.height);
    chain.push(c); cur = c;
  }
  for (let i = steps - 2; i >= -1; i--) {
    const target = i >= 0 ? chain[i] : null;
    const c = document.createElement("canvas");
    c.width = target ? target.width : W; c.height = target ? target.height : H;
    const x = c.getContext("2d"); x.imageSmoothingQuality = "high";
    x.drawImage(cur, 0, 0, c.width, c.height);
    cur = c;
  }
  const out = cur, octx = out.getContext("2d");

  // 3. 清晰的主角疊回去
  const sharp = document.createElement("canvas"); sharp.width = W; sharp.height = H;
  const shctx = sharp.getContext("2d");
  shctx.drawImage(src, 0, 0);
  shctx.globalCompositeOperation = "destination-in";
  shctx.imageSmoothingQuality = "high";
  shctx.drawImage(mask, 0, 0, W, H);
  octx.drawImage(sharp, 0, 0);
  return out;
}

/* ---------- 像素分析：消失點、對稱、地平線、亮度 ---------- */
const probe = document.createElement("canvas");
const pctx = probe.getContext("2d", { willReadFrequently: true });

function analyzePixels(src = video, sw = video.videoWidth, sh = video.videoHeight) {
  const W = 64, H = Math.round(64 * sh / sw);
  probe.width = W; probe.height = H;
  pctx.drawImage(src, 0, 0, W, H);
  const d = pctx.getImageData(0, 0, W, H).data;
  const L = new Float32Array(W * H);
  let mean = 0;
  for (let i = 0; i < W * H; i++) { L[i] = (d[i*4] * .3 + d[i*4+1] * .59 + d[i*4+2] * .11) / 255; mean += L[i]; }
  mean /= W * H;

  // 每列平均亮度
  const row = [];
  for (let y = 0; y < H; y++) { let t = 0; for (let x = 0; x < W; x++) t += L[y*W+x]; row.push(t / W); }
  const avg = (a, b) => { let t = 0; for (let y = a; y < b; y++) t += row[y]; return t / (b - a); };

  // 地平線：上方明顯比下方亮的那一列（天空 vs 地面）
  let horizon = null, bestDiff = .08;
  for (let y = Math.floor(H * .15); y < H * .85; y++) {
    const up = (row[y-3] + row[y-2] + row[y-1]) / 3, down = (row[y] + row[y+1] + row[y+2]) / 3;
    if (up - down > bestDiff) { bestDiff = up - down; horizon = y / H; }
  }

  // 消失點：沿著每條斜向邊緣延伸投票，最多線交會的地方
  const AW = 24, AH = Math.round(24 * H / W), acc = new Float32Array(AW * AH);
  let total = 0;
  for (let y = 2; y < H - 2; y++) for (let x = 2; x < W - 2; x++) {
    const i = y * W + x, gx = L[i+1] - L[i-1], gy = L[i+W] - L[i-W], m = Math.hypot(gx, gy);
    if (m < .1) continue;
    let ux = -gy / m, uy = gx / m;                       // 邊緣方向（垂直於梯度）
    const ang = Math.abs(Math.atan2(uy, ux)) * 180 / Math.PI, a = ang > 90 ? 180 - ang : ang;
    if (a < 10 || a > 80) continue;                      // 水平、垂直線不代表透視
    total += m;
    const px0 = x / W, py0 = y / H, len = Math.hypot(ux / W, uy / H);
    ux = ux / W / len; uy = uy / H / len;
    for (let t = -1.4; t <= 1.4; t += .035) {
      if (Math.abs(t) < .12) continue;                   // 不投給自己附近
      const X = px0 + t * ux, Y = py0 + t * uy;
      if (X < 0 || X >= 1 || Y < 0 || Y >= 1) continue;
      acc[Math.floor(Y * AH) * AW + Math.floor(X * AW)] += m;
    }
  }
  let vp = null;
  if (total > 3) {
    let bestV = 0, bx = 0, by = 0;
    for (let y = 1; y < AH - 1; y++) for (let x = 1; x < AW - 1; x++) {
      let v = 0; for (let j = -1; j <= 1; j++) for (let k = -1; k <= 1; k++) v += acc[(y+j)*AW + x+k];
      if (v > bestV) { bestV = v; bx = x; by = y; }
    }
    const strength = bestV / (total * 3);
    if (strength > .12) vp = { x: (bx + .5) / AW, y: (by + .5) / AH, strength };
  }

  // 左右對稱：找最對稱的中線
  let sym = 0, symAxis = null, texture = 0;
  for (let i = 0; i < W * H - 1; i++) texture += Math.abs(L[i+1] - L[i]);
  texture /= W * H;
  if (texture > .02) {
    for (let a = .35; a <= .65; a += .025) {
      const ax = a * W, span = Math.floor(Math.min(ax, W - ax));
      if (span < 10) continue;
      let diff = 0, n = 0;
      for (let y = 0; y < H; y += 2) for (let k = 1; k < span; k++) {
        diff += Math.abs(L[y*W + Math.floor(ax - k)] - L[y*W + Math.min(W - 1, Math.floor(ax + k))]); n++;
      }
      const s = Math.max(0, 1 - (diff / n) * 6);
      if (s > sym) { sym = s; symAxis = a; }
    }
  }

  // 框中框：四周比中間暗很多（門、窗、拱門）
  let border = 0, nb = 0, inner = 0, ni = 0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const isB = x < W * .15 || x > W * .85 || y < H * .12 || y > H * .88;
    if (isB) { border += L[y*W+x]; nb++; } else { inner += L[y*W+x]; ni++; }
  }
  const frameDark = inner / ni - border / nb;

  const third = Math.floor(H / 3);
  const thumb = new Float32Array(16 * 12);     // 小縮圖，用來判斷是否換了場景
  for (let ty = 0; ty < 12; ty++) for (let tx = 0; tx < 16; tx++)
    thumb[ty * 16 + tx] = L[Math.floor((ty + .5) * H / 12) * W + Math.floor((tx + .5) * W / 16)];
  return {
    thumb,
    mean, horizon, vp, sym, symAxis, frameDark,
    skyBright: avg(0, third) > .6,
    backlit: avg(0, third) - avg(third, third * 2) > .3,
  };
}

/* ---------- 工具 ---------- */
function area(r) { return r.w * r.h; }
function center(r) { return { x: r.x + r.w / 2, y: r.y + r.h / 2 }; }
function contains(r, p) { return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function intersect(a, b) {
  const x = Math.max(a.x, b.x), y = Math.max(a.y, b.y);
  const w = Math.min(a.x + a.w, b.x + b.w) - x, h = Math.min(a.y + a.h, b.y + b.h) - y;
  return w > 0 && h > 0 ? { x, y, w, h } : null;
}
function clamp01(r) { return intersect(r, { x: 0, y: 0, w: 1, h: 1 }); }
