<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="取景教練">
<meta name="theme-color" content="#000000">
<title>取景教練</title>
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --muted: rgba(255,255,255,.65);
    --glass: rgba(20,20,20,.62);
    --chip: rgba(255,255,255,.14);
    --accent: #ffd60a;
    --warn: #ff9f0a;
    --guide: #64d2ff;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.4 -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; overflow: hidden; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  #app { position: fixed; inset: 0; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  #stage { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; min-height: 0; }
  #frame { position: relative; max-width: 100%; max-height: 100%; overflow: hidden; touch-action: none; }
  #video, #overlay { transform-origin: 50% 50%; }
  /* 三分線畫在外框上，數位放大時不會跟著變形 */
  #frame::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(to right, transparent calc(33.33% - .5px), rgba(255,255,255,.3) calc(33.33% - .5px), rgba(255,255,255,.3) calc(33.33% + .5px), transparent calc(33.33% + .5px),
                      transparent calc(66.66% - .5px), rgba(255,255,255,.3) calc(66.66% - .5px), rgba(255,255,255,.3) calc(66.66% + .5px), transparent calc(66.66% + .5px)),
      linear-gradient(to bottom, transparent calc(33.33% - .5px), rgba(255,255,255,.3) calc(33.33% - .5px), rgba(255,255,255,.3) calc(33.33% + .5px), transparent calc(33.33% + .5px),
                      transparent calc(66.66% - .5px), rgba(255,255,255,.3) calc(66.66% - .5px), rgba(255,255,255,.3) calc(66.66% + .5px), transparent calc(66.66% + .5px)); }
  html, body { touch-action: none; }
  #chips { touch-action: pan-x; }
  button { touch-action: manipulation; }
  #zoom { position: absolute; left: 50%; bottom: 70px; transform: translateX(-50%); z-index: 3;
    background: var(--glass); color: var(--accent); font-weight: 700; font-size: 13px;
    padding: 6px 12px; border-radius: 99px; font-variant-numeric: tabular-nums; }
  #video, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
  #video { object-fit: fill; }

  #top { position: absolute; top: 10px; left: 16px; right: 16px; display: flex; gap: 8px; align-items: flex-start; z-index: 2; }
  #scene { background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-radius: 12px; padding: 8px 12px; flex: 1; min-width: 0; }
  #scene b { font-size: 16px; }
  #scene small { display: block; color: var(--muted); font-size: 12px; }
  #cue { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 3;
    background: var(--warn); color: #000; font-weight: 800; font-size: 22px; padding: 10px 22px;
    border-radius: 99px; white-space: nowrap; box-shadow: 0 4px 16px rgba(0,0,0,.4); }
  #cue.ok { background: #30d158; }

  #bottom { padding: 8px 16px 10px; display: flex; flex-direction: column; gap: 10px; }
  #chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  #chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; width: 128px; text-align: left; background: var(--chip); border-radius: 12px; padding: 8px 10px; }
  .chip b { display: block; font-size: 14px; }
  .chip span { font-size: 11px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .chip.on { background: var(--accent); color: #000; }
  .chip.on span { color: rgba(0,0,0,.7); }
  #controls { display: flex; align-items: center; justify-content: space-between; }
  #thumb { width: 54px; height: 54px; border-radius: 8px; background: var(--chip) center/cover; }
  #shutter { width: 74px; height: 74px; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 3px #000, 0 0 0 3px #fff; }
  #shutter:active { transform: scale(.94); }
  #shutter.busy { opacity: .5; }
  #tplBtn { width: 54px; height: 54px; border-radius: 12px; background: var(--chip); display: flex; flex-direction: column;
    align-items: center; justify-content: center; font-size: 11px; gap: 2px; }
  #tplBtn i { font-style: normal; font-size: 20px; line-height: 1; }

  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 10; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; padding: 24px 16px; text-align: center; }
  .sheet h1 { font-size: 28px; margin: 0; }
  .sheet p { color: var(--muted); margin: 0; max-width: 32em; }
  .btn { background: var(--accent); color: #000; font-weight: 700; padding: 14px 28px; border-radius: 99px; font-size: 17px; }
  .btn.ghost { background: var(--chip); color: var(--fg); }
  #preview img { max-height: 60vh; border-radius: 8px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 範本清單 */
  #gallery { justify-content: flex-start; overflow-y: auto; touch-action: pan-y; background: rgba(0,0,0,.94);
    padding-top: calc(env(safe-area-inset-top) + 20px); }
  #gallery header { width: 100%; max-width: 560px; display: flex; justify-content: space-between; align-items: center; }
  #gallery header h1 { font-size: 22px; }
  #tplGrid { width: 100%; max-width: 560px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;
    padding-bottom: 24px; }
  .tpl { background: var(--chip); border-radius: 14px; padding: 12px; text-align: left; display: flex; gap: 10px; min-width: 0; }
  .tpl.on { outline: 2px solid var(--accent); }
  .tpl div { min-width: 0; }
  .tpl b { display: block; font-size: 14px; margin-bottom: 4px; }
  .tpl ol { margin: 0; padding-left: 16px; font-size: 11px; color: var(--muted); }
  .tpl-svg { flex: none; width: 42px; height: 56px; background: #1c1c1e; border-radius: 6px;
    fill: none; stroke: rgba(255,255,255,.7); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tpl-svg .t { stroke: var(--guide); stroke-dasharray: 3 3; }
  .tpl-svg .g { stroke: rgba(255,255,255,.2); stroke-width: 1; }
  #scene .steps { display: block; color: var(--guide); font-size: 12px; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="frame">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="overlay"></canvas>
    </div>
    <div id="top">
      <div id="scene"><b>範本：分析中…</b><small>把鏡頭對準想拍的東西</small></div>
    </div>
    <div id="cue" hidden></div>
    <button id="zoom" hidden>1.0×</button>
  </div>
  <div id="bottom">
    <div id="chips"></div>
    <div id="controls">
      <div id="thumb"></div>
      <button id="shutter" aria-label="拍照"></button>
      <button id="tplBtn"><i>▦</i>範本</button>
    </div>
  </div>
</div>

<div class="sheet" id="startSheet">
  <h1>取景教練</h1>
  <p>自動判斷你在拍什麼，套用專業範本，<br>一步步告訴你怎麼移動、怎麼拍。</p>
  <button class="btn" id="startBtn">開啟相機</button>
  <p id="startMsg"></p>
</div>

<div class="sheet" id="gallery" hidden>
  <header><h1>拍攝範本</h1><button class="btn ghost" id="galleryClose">關閉</button></header>
  <p>App 會自動判斷畫面適合哪個範本，也可以在這裡直接指定。</p>
  <div id="tplGrid"></div>
</div>

<div class="sheet" id="preview" hidden>
  <img id="previewImg" alt="拍好的照片">
  <p>按「儲存／分享」→「儲存影像」存到相簿，或長按照片 →「加入照片」</p>
  <div style="display:flex;gap:10px">
    <button class="btn" id="shareBtn">儲存／分享</button>
    <button class="btn ghost" id="previewClose">繼續拍</button>
  </div>
</div>

<script type="module">
import { FilesetResolver, ObjectDetector, FaceDetector, ImageSegmenter }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
import { TEMPLATES, rankTemplates, templateSVG } from "./templates.js";

const $ = id => document.getElementById(id);
const video = $("video"), overlay = $("overlay"), ctx = overlay.getContext("2d");
const GUIDE = "#64d2ff";

const FOOD = ["banana","apple","sandwich","orange","broccoli","carrot","hot dog","pizza","donut","cake","bowl","cup","wine glass"];
const ANIMAL = ["bird","cat","dog","horse","sheep","cow","elephant","bear","zebra","giraffe"];
const NAMES = { person: "人", dog: "狗", cat: "貓", bird: "鳥", cup: "杯子", bowl: "碗", cake: "蛋糕",
  pizza: "披薩", "potted plant": "盆栽", vase: "花瓶", car: "車", bicycle: "腳踏車", book: "書", "cell phone": "手機",
  bottle: "瓶子", "wine glass": "酒杯", sandwich: "三明治", donut: "甜甜圈", chair: "椅子", bench: "長椅" };

/* ---------- 狀態 ---------- */
let visionFiles, objDet, faceDet, segmenter;
let tiltDeg = null, gravity = null;
let lastPhoto = null, lastRun = 0;
let allCands = [], mainCand = null, lock = null, cue = null;
let feat = null;                     // 最近一次的畫面特徵
let ranked = [];                     // 符合的範本（分數高到低）
let active = null;                   // 目前套用的範本
let manualId = null;                 // 使用者手動指定的範本
let pendingId = null, pendingCount = 0;
let zoom = 1, hwZoom = null, pinch = null, lastPinchEnd = 0;

/* ---------- 啟動 ---------- */
$("startBtn").onclick = async () => {
  $("startMsg").textContent = "載入中…";
  try {
    // iOS 需要使用者點擊後才能讀取陀螺儀
    if (window.DeviceMotionEvent?.requestPermission) {
      try { await DeviceMotionEvent.requestPermission(); } catch {}
    }
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1440 } }, audio: false });
    video.srcObject = stream;
    const track = stream.getVideoTracks()[0], cap = track.getCapabilities?.() || {};
    if (cap.zoom) hwZoom = { track, min: Math.max(cap.zoom.min, 1), max: Math.min(cap.zoom.max, 10) };
    await video.play();
    layout();
    $("startSheet").hidden = true;
    loadModels();
    window.addEventListener("devicemotion", onMotion);
    requestAnimationFrame(loop);
  } catch (e) {
    $("startMsg").textContent = "無法開啟相機：" + e.message + "。請在 Safari 設定允許相機。";
  }
};

async function loadModels() {
  visionFiles = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  objDet = await ObjectDetector.createFromOptions(visionFiles, {
    baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite", delegate: "GPU" },
    scoreThreshold: 0.35, runningMode: "VIDEO" });
  faceDet = await FaceDetector.createFromOptions(visionFiles, {
    baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite", delegate: "GPU" },
    runningMode: "VIDEO" });
}

/* 讓畫面框和相機畫面同比例 */
function layout() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw) return;
  const st = $("stage").getBoundingClientRect();
  const s = Math.min(st.width / vw, st.height / vh);
  const f = $("frame");
  f.style.width = vw * s + "px"; f.style.height = vh * s + "px";
  overlay.width = vw * s * devicePixelRatio; overlay.height = vh * s * devicePixelRatio;
}
window.addEventListener("resize", layout);
video.addEventListener("loadedmetadata", layout);

/* ---------- 水平與手機姿勢 ---------- */
function onMotion(e) {
  const g = e.accelerationIncludingGravity;
  if (!g || g.x == null) return;
  gravity = g;
  // 手機接近平放時不判斷左右傾斜（例如俯拍美食）
  if (Math.abs(g.z) > Math.hypot(g.x, g.y)) { tiltDeg = null; return; }
  const deg = Math.atan2(g.x, Math.abs(g.y)) * 180 / Math.PI;
  tiltDeg = Math.abs(deg) > 3 && Math.abs(deg) < 35 ? deg : null;
}
const phoneFlat = () => !!gravity && Math.abs(gravity.z) > 8;

/* ---------- 分析迴圈 ---------- */
let lastDims = "";
function loop(t) {
  const dims = `${video.videoWidth}x${video.videoHeight}x${innerWidth}x${innerHeight}`;
  if (dims !== lastDims) { lastDims = dims; layout(); }
  if (objDet && faceDet && t - lastRun > 300 && video.readyState >= 2) {
    lastRun = t;
    analyze(t);
  }
  draw();
  requestAnimationFrame(loop);
}

function analyze(t) {
  const W = video.videoWidth, H = video.videoHeight;
  const norm = b => ({ x: b.originX / W, y: b.originY / H, w: b.width / W, h: b.height / H });
  const faceDets = faceDet.detectForVideo(video, t).detections;
  const objs = objDet.detectForVideo(video, t + 1).detections
    .map(d => ({ name: d.categories[0].categoryName, score: d.categories[0].score, box: norm(d.boundingBox) }));

  // 候選主角：每張臉（含肩膀）＋每個物件（已有臉的人不重複）
  const cands = faceDets.map(d => {
    const f = norm(d.boundingBox), k = d.keypoints || [];
    return { name: "person", box: clamp01({ x: f.x - f.w * .3, y: f.y - f.h * .2, w: f.w * 1.6, h: f.h * 2.6 }),
             face: { box: f, eyes: k.slice(0, 2), nose: k[2] }, score: 1.5 };
  });
  for (const o of objs) {
    if (o.name === "dining table") continue;
    if (o.name === "person" && cands.some(c => c.face && contains(o.box, center(c.face.box)))) continue;
    cands.push(o);
  }

  // 選主角：鎖定的優先（持續追蹤），否則選又大又靠近中央的
  let main = null;
  if (lock) {
    const same = cands.filter(c => !!c.face === lock.face && (lock.face || c.name === lock.cand.name));
    const near = same.length ? same.reduce((a, b) => dist(center(b.box), center(lock.cand.box)) < dist(center(a.box), center(lock.cand.box)) ? b : a) : null;
    if (near && dist(center(near.box), center(lock.cand.box)) < .3) { main = lock.cand = near; lock.miss = 0; }
    else if (++lock.miss <= 4) main = lock.cand;          // 短暫沒偵測到：保留約 1 秒
    else lock = null;                                      // 離開畫面：解除鎖定
  }
  if (!main && cands.length) {
    const rank = c => Math.sqrt(area(c.box)) * c.score * (1.3 - dist(center(c.box), { x: .5, y: .5 }));
    main = cands.reduce((a, b) => rank(b) > rank(a) ? b : a);
  }
  mainCand = main;
  allCands = cands;

  // 畫面特徵
  const p = analyzePixels();
  const isPerson = !!main && (!!main.face || main.name === "person");
  const personBox = main?.face
    ? objs.find(o => o.name === "person" && contains(o.box, center(main.face.box)))?.box || null
    : main?.name === "person" ? main.box : null;
  let face = null;
  if (main?.face) {
    const fc = main.face;
    let turn = 0;
    if (fc.eyes.length === 2 && fc.nose) {
      const mx = (fc.eyes[0].x + fc.eyes[1].x) / 2;
      turn = (fc.nose.x - mx) / (Math.abs(fc.eyes[0].x - fc.eyes[1].x) + 1e-3);
    }
    face = { ...fc, turn };
  }
  feat = {
    face, person: personBox, subjectBox: main?.box || null, subjectIsPerson: isPerson,
    food: !!main && FOOD.includes(main.name), animal: !!main && ANIMAL.includes(main.name),
    object: !!main && !isPerson && !FOOD.includes(main.name) && !ANIMAL.includes(main.name),
    flat: phoneFlat(), ...p,
  };

  chooseTemplate();
  cue = computeCue(feat, active);
  renderTop();
}

/* ---------- 範本選擇 ---------- */
function chooseTemplate() {
  ranked = rankTemplates(feat);
  let next;
  if (manualId) next = TEMPLATES.find(t => t.id === manualId);
  else {
    const top = ranked[0]?.t || null;
    // 避免範本一直跳：新範本要連續勝出 3 次（約 1 秒）才切換
    if (!active || !top || top === active || !ranked.some(r => r.t === active)) next = top;
    else {
      if (pendingId === top.id) pendingCount++; else { pendingId = top.id; pendingCount = 1; }
      next = pendingCount >= 3 ? top : active;
    }
  }
  if (next !== active) {
    active = next;
    pendingId = null;
    if (active?.zoom && hwZoom) setZoom(active.zoom);    // 自動切換焦段
  }
  renderChips();
}

function renderTop() {
  if (!active) {
    $("scene").innerHTML = `<b>範本：一般</b><small>對準人、長廊、建築、風景或美食試試</small>`;
    return;
  }
  const mode = manualId ? "指定" : "自動";
  $("scene").innerHTML = `<b>${active.name}</b><small>${mode}・點主角可鎖定・雙指縮放</small>` +
    `<span class="steps">${active.steps.map((s, i) => `${i + 1}. ${s}`).join("　")}</span>`;
}

function renderChips() {
  const shown = ranked.slice(0, 4).map(r => r.t);
  if (active && !shown.includes(active)) shown.unshift(active);
  const items = [{ id: "", short: "自動", tip: manualId ? "回到自動判斷" : "自動判斷中" }, ...shown.map(t => ({ id: t.id, short: t.short, tip: t.steps[0] }))];
  const html = items.map(s => {
    const on = s.id === "" ? !manualId : s.id === manualId || (!manualId && active?.id === s.id);
    return `<button class="chip${on ? " on" : ""}" data-id="${s.id}"><b>${s.short}</b><span>${s.tip}</span></button>`;
  }).join("");
  if ($("chips").innerHTML !== html) $("chips").innerHTML = html;
}
$("chips").onclick = e => {
  const b = e.target.closest(".chip"); if (!b) return;
  pickTemplate(b.dataset.id || null);
};
function pickTemplate(id) {
  manualId = id;
  if (feat) { chooseTemplate(); cue = computeCue(feat, active); renderTop(); }
}

/* ---------- 範本清單 ---------- */
$("tplBtn").onclick = () => {
  $("tplGrid").innerHTML = TEMPLATES.map(t =>
    `<button class="tpl${t.id === manualId ? " on" : ""}" data-id="${t.id}">${templateSVG(t)}<div><b>${t.name}</b><ol>${t.steps.map(s => `<li>${s}</li>`).join("")}</ol></div></button>`).join("");
  $("gallery").hidden = false;
};
$("galleryClose").onclick = () => $("gallery").hidden = true;
$("tplGrid").onclick = e => {
  const b = e.target.closest(".tpl"); if (!b) return;
  pickTemplate(b.dataset.id);
  $("gallery").hidden = true;
};

/* ---------- 引導：一次只給一個最重要的提示 ---------- */
// cur 是東西現在的位置，tgt 是範本要它在的位置。東西偏右 → 手機往右轉，它就會往中間移
function moveCue(cur, tgt, tol = .06) {
  const dx = cur.x == null ? 0 : cur.x - tgt.x, dy = cur.y == null ? 0 : cur.y - tgt.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) <= tol) return null;
  return Math.abs(dx) >= Math.abs(dy) ? { t: dx > 0 ? "→ 往右移" : "← 往左移" } : { t: dy > 0 ? "↓ 往下移" : "↑ 往上移" };
}

function computeCue(f, tpl) {
  if (tiltDeg !== null && !f.flat) return { t: `↻ 轉正 ${Math.abs(Math.round(tiltDeg))}°` };
  if (f.face && (f.face.box.x < .01 || f.face.box.x + f.face.box.w > .99 || f.face.box.y < .01)) return { t: "↙ 退後一點" };
  if (tpl) {
    const g = tpl.target(f);
    if (g.vp && f.vp) { const c = moveCue(f.vp, g.vp, .07); if (c) return c; }
    if (g.eyes && f.face?.eyes.length === 2) {
      const e = { x: (f.face.eyes[0].x + f.face.eyes[1].x) / 2, y: (f.face.eyes[0].y + f.face.eyes[1].y) / 2 };
      const c = moveCue(e, g.eyes, .07); if (c) return c;
    }
    if (g.faceH && f.face) {
      if (f.face.box.h < g.faceH * .7) return { t: "⊕ 靠近一點" };
      if (f.face.box.h > g.faceH * 1.5) return { t: "⊖ 退後一點" };
    }
    if (g.person && f.person) {
      if (f.person.y < .02 || f.person.y + f.person.h > .995) return { t: "⊖ 退後，全身要入鏡" };
      const c = moveCue({ y: f.person.y + f.person.h }, { y: g.person.bottom }, .05); if (c) return c;
      if (f.person.h < .6) return { t: "⊕ 靠近一點" };
    }
    if (g.subject && f.subjectBox) { const c = moveCue(center(f.subjectBox), g.subject, .07); if (c) return c; }
    if (g.subjectH && f.subjectBox) {
      if (f.subjectBox.h < g.subjectH * .7) return { t: "⊕ 靠近一點" };
      if (f.subjectBox.h > g.subjectH * 1.6) return { t: "⊖ 退後一點" };
    }
    if (g.horizon != null && f.horizon != null) { const c = moveCue({ y: f.horizon }, { y: g.horizon }, .06); if (c) return c; }
    if (g.axis != null && f.symAxis != null) { const c = moveCue({ x: f.symAxis }, { x: g.axis }, .04); if (c) return c; }
  }
  if (f.backlit) return { t: "☀ 逆光，換個方向" };
  if (f.mean < .22) return { t: "☾ 太暗了" };
  return { t: "✓ 可以拍了", ok: true };
}

/* ---------- 畫面 ---------- */
function draw() {
  const W = overlay.width, H = overlay.height, d = devicePixelRatio;
  ctx.clearRect(0, 0, W, H);

  // 範本的目標位置（藍色虛線）
  if (active && feat) drawTarget(active.target(feat), W, H, d);

  // 其他可選的人或物：淡淡的細框，點了就鎖定
  ctx.strokeStyle = "rgba(255,255,255,.45)"; ctx.lineWidth = 1 * d; ctx.setLineDash([3 * d, 3 * d]);
  for (const c of allCands) if (c !== mainCand) { const r = px(c.face ? c.face.box : c.box); ctx.strokeRect(r.x, r.y, r.w, r.h); }
  ctx.setLineDash([]);
  if (mainCand) {
    const r = px(mainCand.face ? mainCand.face.box : mainCand.box), L = Math.min(r.w, r.h) * .25;
    ctx.strokeStyle = "#ffd60a"; ctx.lineWidth = 3 * d; ctx.beginPath();
    for (const [cx, cy, sx, sy] of [[r.x, r.y, 1, 1], [r.x + r.w, r.y, -1, 1], [r.x, r.y + r.h, 1, -1], [r.x + r.w, r.y + r.h, -1, -1]]) {
      ctx.moveTo(cx, cy + sy * L); ctx.lineTo(cx, cy); ctx.lineTo(cx + sx * L, cy);
    }
    ctx.stroke();
    const label = (lock ? "🔒 " : "主角・") + (mainCand.face ? "人" : NAMES[mainCand.name] || mainCand.name);
    ctx.font = `700 ${13 * d}px -apple-system, sans-serif`;
    const tw = ctx.measureText(label).width + 12 * d, ty = Math.max(r.y - 24 * d, 0);
    ctx.fillStyle = "#ffd60a"; ctx.fillRect(r.x, ty, tw, 20 * d);
    ctx.fillStyle = "#000"; ctx.fillText(label, r.x + 6 * d, ty + 15 * d);
  }
  const cueEl = $("cue");
  if (cue) { cueEl.hidden = false; if (cueEl.textContent !== cue.t) cueEl.textContent = cue.t; cueEl.classList.toggle("ok", !!cue.ok); }
}

function drawTarget(g, W, H, d) {
  ctx.save();
  ctx.strokeStyle = GUIDE; ctx.fillStyle = GUIDE; ctx.lineWidth = 2 * d; ctx.setLineDash([8 * d, 6 * d]);
  ctx.font = `700 ${12 * d}px -apple-system, sans-serif`;
  const label = (text, x, y) => { ctx.save(); ctx.setLineDash([]); ctx.fillText(text, x, y); ctx.restore(); };
  const hline = (y, text) => { ctx.beginPath(); ctx.moveTo(0, y * H); ctx.lineTo(W, y * H); ctx.stroke(); label(text, 8 * d, y * H - 6 * d); };

  if (g.vp) {
    const x = g.vp.x * W, y = g.vp.y * H;
    ctx.beginPath(); ctx.arc(x, y, 18 * d, 0, Math.PI * 2); ctx.stroke();
    label("消失點放這", x - 30 * d, y - 24 * d);
    if (feat.vp) {   // 目前的消失點（實心點）＋連線
      const cx = feat.vp.x * W, cy = feat.vp.y * H;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x, y); ctx.stroke();
      ctx.setLineDash([]); ctx.beginPath(); ctx.arc(cx, cy, 5 * d, 0, Math.PI * 2); ctx.fill();
    }
  }
  if (g.eyes) {
    const y = g.eyes.y * H;
    hline(g.eyes.y, "眼睛放這條線");
    ctx.setLineDash([]); ctx.beginPath(); ctx.arc(g.eyes.x * W, y, 6 * d, 0, Math.PI * 2); ctx.fill();
  }
  if (g.person) { hline(g.person.top, "頭頂"); hline(g.person.bottom, "腳底"); }
  if (g.horizon != null) {
    hline(g.horizon, "地平線放這");
    if (feat.horizon != null) {   // 目前偵測到的地平線（細實線）
      ctx.save(); ctx.setLineDash([]); ctx.lineWidth = 1 * d; ctx.strokeStyle = "rgba(100,210,255,.5)";
      ctx.beginPath(); ctx.moveTo(0, feat.horizon * H); ctx.lineTo(W, feat.horizon * H); ctx.stroke(); ctx.restore();
    }
  }
  if (g.axis != null) {
    ctx.beginPath(); ctx.moveTo(g.axis * W, 0); ctx.lineTo(g.axis * W, H); ctx.stroke();
    label("中線對齊", g.axis * W + 6 * d, 40 * d);
  }
  if (g.subject) {
    const x = g.subject.x * W, y = g.subject.y * H, r = (g.subjectH ? g.subjectH * H / 2 : 26 * d);
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
    label("主角放這", x - 24 * d, y - r - 6 * d);
  }
  ctx.restore();
}
const px = r => ({ x: r.x * overlay.width, y: r.y * overlay.height, w: r.w * overlay.width, h: r.h * overlay.height });

/* ---------- 雙指縮放（只縮放相機畫面） ---------- */
function setZoom(z) {
  if (hwZoom) {
    z = Math.min(Math.max(z, hwZoom.min), hwZoom.max);
    hwZoom.track.applyConstraints({ advanced: [{ zoom: z }] }).catch(() => {});
  } else {
    z = Math.min(Math.max(z, 1), 5);
    video.style.transform = overlay.style.transform = z === 1 ? "" : `scale(${z})`;
  }
  zoom = z;
  $("zoom").hidden = z <= 1.01;
  $("zoom").textContent = z.toFixed(1) + "×";
}
const stage = $("stage");
const span = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
stage.addEventListener("touchstart", e => {
  if (e.touches.length === 2) { pinch = { d: span(e.touches), z: zoom }; e.preventDefault(); }
}, { passive: false });
stage.addEventListener("touchmove", e => {
  if (pinch && e.touches.length === 2) { setZoom(pinch.z * span(e.touches) / pinch.d); e.preventDefault(); }
}, { passive: false });
stage.addEventListener("touchend", e => {
  if (pinch && e.touches.length < 2) { pinch = null; lastPinchEnd = performance.now(); }
});
$("zoom").onclick = () => setZoom(1);
// 擋掉 Safari 的整頁縮放
for (const ev of ["gesturestart", "gesturechange", "gestureend"]) document.addEventListener(ev, e => e.preventDefault());
let lastTouch = 0;
document.addEventListener("touchend", e => {
  if (e.target.closest("#gallery")) return;
  const n = performance.now(); if (n - lastTouch < 300) e.preventDefault(); lastTouch = n;
}, { passive: false });

/* ---------- 點畫面鎖定主角 ---------- */
overlay.addEventListener("click", e => {
  if (performance.now() - lastPinchEnd < 400) return;     // 剛縮放完的觸控不算點擊
  const b = overlay.getBoundingClientRect();
  const pt = { x: (e.clientX - b.left) / b.width, y: (e.clientY - b.top) / b.height };
  const boxOf = c => c.face ? c.face.box : c.box;
  const hit = allCands.filter(c => contains(boxOf(c), pt) || contains(c.box, pt))
    .sort((a, b) => area(boxOf(a)) - area(boxOf(b)))[0];   // 重疊時選比較小的那個
  if (lock && hit === mainCand) lock = null;               // 點已鎖定的主角 = 解除
  else if (hit) { lock = { cand: hit, face: !!hit.face, miss: 0 }; mainCand = hit; }
});

/* ---------- 拍照 ---------- */
$("shutter").onclick = async () => {
  if ($("shutter").classList.contains("busy")) return;
  const W = video.videoWidth, H = video.videoHeight;
  // 數位放大時只存看得到的範圍
  const v = hwZoom || zoom <= 1 ? { x: 0, y: 0, w: 1, h: 1 }
    : { x: .5 - .5 / zoom, y: .5 - .5 / zoom, w: 1 / zoom, h: 1 / zoom };
  let c = document.createElement("canvas");
  c.width = Math.round(v.w * W); c.height = Math.round(v.h * H);
  c.getContext("2d").drawImage(video, v.x * W, v.y * H, v.w * W, v.h * H, 0, 0, c.width, c.height);

  // 範本需要背景柔焦時：保留主角，模糊背景
  if (active?.bokeh && mainCand) {
    $("shutter").classList.add("busy");
    try {
      const sub = mainCand.box, inView = {
        x: (sub.x - v.x) / v.w, y: (sub.y - v.y) / v.h, w: sub.w / v.w, h: sub.h / v.h };
      c = await applyBokeh(c, inView, !!mainCand.face || mainCand.name === "person");
    } catch {}
    $("shutter").classList.remove("busy");
  }

  c.toBlob(blob => {
    lastPhoto = blob;
    const url = URL.createObjectURL(blob);
    $("thumb").style.backgroundImage = `url(${url})`;
    $("previewImg").src = url;
    $("preview").hidden = false;
  }, "image/jpeg", .92);
};
$("thumb").onclick = () => { if (lastPhoto) $("preview").hidden = false; };
$("previewClose").onclick = () => $("preview").hidden = true;
$("shareBtn").onclick = async () => {
  const file = new File([lastPhoto], `取景教練-${Date.now()}.jpg`, { type: "image/jpeg" });
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file] }); } catch {}
  }
};

/* ---------- 背景柔焦（模擬大光圈） ---------- */
async function applyBokeh(src, subject, isPerson) {
  const W = src.width, H = src.height;

  // 1. 主角遮罩：人用去背模型，物品用主角周圍的柔邊橢圓
  const mask = document.createElement("canvas");
  if (isPerson) {
    if (!segmenter) segmenter = await ImageSegmenter.createFromOptions(visionFiles, {
      baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite", delegate: "GPU" },
      runningMode: "IMAGE", outputConfidenceMasks: true, outputCategoryMask: false });
    const res = segmenter.segment(src);
    const m = res.confidenceMasks[0], data = m.getAsFloat32Array();
    mask.width = m.width; mask.height = m.height;
    const img = mask.getContext("2d").createImageData(m.width, m.height);
    for (let i = 0; i < data.length; i++) img.data[i * 4 + 3] = Math.min(255, data[i] * 290);
    mask.getContext("2d").putImageData(img, 0, 0);
    res.close?.();
  } else {
    mask.width = 200; mask.height = Math.round(200 * H / W);
    const m = mask.getContext("2d"), c = center(subject);
    const rx = subject.w * mask.width * .75, ry = subject.h * mask.height * .75;
    m.translate(c.x * mask.width, c.y * mask.height); m.scale(1, ry / rx);
    const gr = m.createRadialGradient(0, 0, rx * .6, 0, 0, rx);
    gr.addColorStop(0, "#000"); gr.addColorStop(1, "rgba(0,0,0,0)");
    m.fillStyle = gr; m.beginPath(); m.arc(0, 0, rx, 0, Math.PI * 2); m.fill();
  }

  // 2. 模糊背景：縮小再放大（Safari 的 canvas 不一定支援 filter）
  const small = document.createElement("canvas");
  small.width = Math.max(1, Math.round(W / 14)); small.height = Math.max(1, Math.round(H / 14));
  const sctx = small.getContext("2d"); sctx.imageSmoothingQuality = "high";
  sctx.drawImage(src, 0, 0, small.width, small.height);
  const out = document.createElement("canvas"); out.width = W; out.height = H;
  const octx = out.getContext("2d"); octx.imageSmoothingQuality = "high";
  octx.drawImage(small, 0, 0, W, H);

  // 3. 清晰的主角疊回去
  const sharp = document.createElement("canvas"); sharp.width = W; sharp.height = H;
  const shctx = sharp.getContext("2d");
  shctx.drawImage(src, 0, 0);
  shctx.globalCompositeOperation = "destination-in";
  shctx.imageSmoothingQuality = "high";
  shctx.drawImage(mask, 0, 0, W, H);
  octx.drawImage(sharp, 0, 0);
  return out;
}

/* ---------- 像素分析：消失點、對稱、地平線、亮度 ---------- */
const probe = document.createElement("canvas");
const pctx = probe.getContext("2d", { willReadFrequently: true });

function analyzePixels() {
  const W = 64, H = Math.round(64 * video.videoHeight / video.videoWidth);
  probe.width = W; probe.height = H;
  pctx.drawImage(video, 0, 0, W, H);
  const d = pctx.getImageData(0, 0, W, H).data;
  const L = new Float32Array(W * H);
  let mean = 0;
  for (let i = 0; i < W * H; i++) { L[i] = (d[i*4] * .3 + d[i*4+1] * .59 + d[i*4+2] * .11) / 255; mean += L[i]; }
  mean /= W * H;

  // 每列平均亮度
  const row = [];
  for (let y = 0; y < H; y++) { let t = 0; for (let x = 0; x < W; x++) t += L[y*W+x]; row.push(t / W); }
  const avg = (a, b) => { let t = 0; for (let y = a; y < b; y++) t += row[y]; return t / (b - a); };

  // 地平線：上方明顯比下方亮的那一列（天空 vs 地面）
  let horizon = null, bestDiff = .08;
  for (let y = Math.floor(H * .15); y < H * .85; y++) {
    const up = (row[y-3] + row[y-2] + row[y-1]) / 3, down = (row[y] + row[y+1] + row[y+2]) / 3;
    if (up - down > bestDiff) { bestDiff = up - down; horizon = y / H; }
  }

  // 消失點：沿著每條斜向邊緣延伸投票，最多線交會的地方
  const AW = 24, AH = Math.round(24 * H / W), acc = new Float32Array(AW * AH);
  let total = 0;
  for (let y = 2; y < H - 2; y++) for (let x = 2; x < W - 2; x++) {
    const i = y * W + x, gx = L[i+1] - L[i-1], gy = L[i+W] - L[i-W], m = Math.hypot(gx, gy);
    if (m < .1) continue;
    let ux = -gy / m, uy = gx / m;                       // 邊緣方向（垂直於梯度）
    const ang = Math.abs(Math.atan2(uy, ux)) * 180 / Math.PI, a = ang > 90 ? 180 - ang : ang;
    if (a < 10 || a > 80) continue;                      // 水平、垂直線不代表透視
    total += m;
    const px0 = x / W, py0 = y / H, len = Math.hypot(ux / W, uy / H);
    ux = ux / W / len; uy = uy / H / len;
    for (let t = -1.4; t <= 1.4; t += .035) {
      if (Math.abs(t) < .12) continue;                   // 不投給自己附近
      const X = px0 + t * ux, Y = py0 + t * uy;
      if (X < 0 || X >= 1 || Y < 0 || Y >= 1) continue;
      acc[Math.floor(Y * AH) * AW + Math.floor(X * AW)] += m;
    }
  }
  let vp = null;
  if (total > 3) {
    let bestV = 0, bx = 0, by = 0;
    for (let y = 1; y < AH - 1; y++) for (let x = 1; x < AW - 1; x++) {
      let v = 0; for (let j = -1; j <= 1; j++) for (let k = -1; k <= 1; k++) v += acc[(y+j)*AW + x+k];
      if (v > bestV) { bestV = v; bx = x; by = y; }
    }
    const strength = bestV / (total * 3);
    if (strength > .12) vp = { x: (bx + .5) / AW, y: (by + .5) / AH, strength };
  }

  // 左右對稱：找最對稱的中線
  let sym = 0, symAxis = null, texture = 0;
  for (let i = 0; i < W * H - 1; i++) texture += Math.abs(L[i+1] - L[i]);
  texture /= W * H;
  if (texture > .02) {
    for (let a = .35; a <= .65; a += .025) {
      const ax = a * W, span = Math.floor(Math.min(ax, W - ax));
      if (span < 10) continue;
      let diff = 0, n = 0;
      for (let y = 0; y < H; y += 2) for (let k = 1; k < span; k++) {
        diff += Math.abs(L[y*W + Math.floor(ax - k)] - L[y*W + Math.min(W - 1, Math.floor(ax + k))]); n++;
      }
      const s = Math.max(0, 1 - (diff / n) * 6);
      if (s > sym) { sym = s; symAxis = a; }
    }
  }

  // 框中框：四周比中間暗很多（門、窗、拱門）
  let border = 0, nb = 0, inner = 0, ni = 0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const isB = x < W * .15 || x > W * .85 || y < H * .12 || y > H * .88;
    if (isB) { border += L[y*W+x]; nb++; } else { inner += L[y*W+x]; ni++; }
  }
  const frameDark = inner / ni - border / nb;

  const third = Math.floor(H / 3);
  return {
    mean, horizon, vp, sym, symAxis, frameDark,
    skyBright: avg(0, third) > .6,
    backlit: avg(0, third) - avg(third, third * 2) > .3,
  };
}

/* ---------- 工具 ---------- */
function area(r) { return r.w * r.h; }
function center(r) { return { x: r.x + r.w / 2, y: r.y + r.h / 2 }; }
function contains(r, p) { return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function intersect(a, b) {
  const x = Math.max(a.x, b.x), y = Math.max(a.y, b.y);
  const w = Math.min(a.x + a.w, b.x + b.w) - x, h = Math.min(a.y + a.h, b.y + b.h) - y;
  return w > 0 && h > 0 ? { x, y, w, h } : null;
}
function clamp01(r) { return intersect(r, { x: 0, y: 0, w: 1, h: 1 }); }
</script>
